icient):\", model.coef_[0])\nprint(\"Intercept          :\", model.intercept_)\n\n# 8. Predict marks for the test data\ny_pred = model.predict(X_test)\n\n# 9. Actual vs predicted marks\nresult = pd.DataFrame({\"Actual\": y_test, \"Predicted\": y_pred})\nprint(result)\n\n# 10. Evaluation metrics\nmae = mean_absolute_error(y_test, y_pred)\nmse = mean_squared_error(y_test, y_pred)\nrmse = np.sqrt(mse)\nr2 = r2_score(y_test, y_pred)\nprint(\"MAE :\", mae)\nprint(\"MSE :\", mse)\nprint(\"RMSE:\", rmse)\nprint(\"R2  :\", r2)\n\n# 11. Predict marks for a student who studies 7.5 hours\nhours = pd.DataFrame({\"Hours_Studied\": [7.5]})\nprint(\"Predicted marks for 7.5 hours:\", model.predict(hours)[0])\n\n# 12. Plot the data points and the regression line\nplt.scatter(X, y, color=\"blue\", label=\"Actual data\")\nplt.plot(X, model.predict(X), color=\"red\", label=\"Regression line\")\nplt.xlabel(\"Hours Studied\")\nplt.ylabel(\"Marks\")\nplt.title(\"Simple Linear Regression\")\nplt.legend()\nplt.show()\n", "e03a": "import numpy as np\n\ndef step(z):\n    return (z >= 0).astype(int)                # threshold activation\n\n# Pre-initialised (hand-chosen) weights and biases\nW1 = np.array([[1, 1],                         # column 1 -> h1 = OR(x1, x2)\n               [1, 1]])                        # column 2 -> h2 = AND(x1, x2)\nb1 = np.array([-0.5, -1.5])\nW2 = np.array([[1], [-1]])                     # out = h1 AND NOT h2  (= XOR)\nb2 = np.array([-0.5])\n\nX = np.array([[0, 0], [0, 1], [1, 0], [1, 1]])\nh = step(X @ W1 + b1)\ny = step(h @ W2 + b2)\nprint(\"x1 x2 | h1 h2 | out\")\nfor x, hid, out in zip(X, h, y):\n    print(f\" {x[0]}  {x[1]} |  {hid[0]}  {hid[1]} |  {out[0]}\")\n\n# Robustness check: the 4 corners plus Gaussian noise\nrng = np.random.default_rng()\nXn = np.repeat(X, 50, axis=0) + rng.normal(0, 0.25, (200, 2))\ntarget = np.repeat([0, 1, 1, 0], 50)\npred = step(step(Xn @ W1 + b1) @ W2 + b2).ravel()\nprint(\"accuracy on noisy inputs:\", np.mean(pred == target))\n", "e03b": "import numpy as np\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng()\nX = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)\ny = np.array([[0], [1], [1], [0]], dtype=float)\n\nsigmoid = lambda z: 1 / (1 + np.exp(-z))\n\n# Random initial weights: 2 inputs -> 4 hidden -> 1 output\nW1 = rng.normal(0, 1, (2, 4)); b1 = np.zeros((1, 4))\nW2 = rng.normal(0, 1, (4, 1)); b2 = np.zeros((1, 1))\nlr = 0.5\nlosses = []\n\nfor epoch in range(10000):\n    # forward pass\n    h = sigmoid(X @ W1 + b1)\n    out = sigmoid(h @ W2 + b2)\n    loss = np.mean((y - out) ** 2)\n\n    # backward pass (chain rule)\n    d_out = (out - y) * out * (1 - out)        # error at the output\n    d_h = (d_out @ W2.T) * h * (1 - h)         # error sent back to the hidden layer\n\n    # gradient descent update\n    W2 -= lr * h.T @ d_out;  b2 -= lr * d_out.sum(axis=0, keepdims=True)\n    W1 -= lr * X.T @ d_h;    b1 -= lr * d_h.sum(axis=0, keepdims=True)\n\n    losses.append(loss)\n    if epoch % 1000 == 0:\n        print(f\"epoch {epoch:5d}  loss = {loss:.6f}\")\n\nprint(\"x1 x2 | target | prediction\")\nfor xi, ti, pi in zip(X, y, out):\n    print(f\" {int(xi[0])}  {int(xi[1])} |   {int(ti[0])}    |  {pi[0]:.4f} -> {int(pi[0] > 0.5)}\")\n\nplt.plot(losses); plt.yscale(\"log\"); plt.title(\"XOR loss\"); plt.show()\n", "e03c": "import numpy as np\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\n\nX = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=\"float32\")\ny = np.array([0, 1, 1, 0], dtype=\"float32\")\n\nmodel = keras.Sequential([\n    layers.Dense(8, activation=\"tanh\", input_shape=(2,)),   # hidden layer\n    layers.Dense(1, activation=\"sigmoid\"),                  # output layer\n])\nmodel.compile(optimizer=keras.optimizers.Adam(0.05),\n              loss=\"binary_crossentropy\", metrics=[\"accuracy\"])\nmodel.summary()\n\nhistory = model.fit(X, y, epochs=300, batch_size=4, verbose=0)\n\nprint(\"Predictions:\\n\", model.predict(X).round(3))\nprint(\"Final loss    :\", history.history[\"loss\"][-1])\nprint(\"Final accuracy:\", history.history[\"accuracy\"][-1])\n", "e04": "import numpy as np\nimport pandas as pd\n\ndf = pd.read_csv(\"data.csv\")                   # your lab dataset\nprint(df.head())\nprint(df.isna().sum())                         # missing values per column\n\n# 1. Inconsistent values: make text uniform, remove impossible numbers\ndf[\"City\"] = df[\"City\"].str.strip().str.title()\ndf[\"Gender\"] = df[\"Gender\"].str.strip().str.lower().str[0].map({\"m\": \"Male\", \"f\": \"Female\"})\ndf.loc[(df[\"Age\"] < 0) | (df[\"Age\"] > 100), \"Age\"] = np.nan\n\n# 2. Missing values: fill with the median\ndf[\"Age\"] = df[\"Age\"].fillna(df[\"Age\"].median())\ndf[\"Salary\"] = df[\"Salary\"].fillna(df[\"Salary\"].median())\n\n# 3. Outliers: IQR rule, then clip (winsorise)\nq1, q3 = df[\"Salary\"].quantile([0.25, 0.75])\niqr = q3 - q1\nlow, high = q1 - 1.5 * iqr, q3 + 1.5 * iqr\nprint(\"Outliers:\", ((df[\"Salary\"] < low) | (df[\"Salary\"] > high)).sum())\ndf[\"Salary\"] = df[\"Salary\"].clip(low, high)\n\n# 4. Scaling\ndf[\"Salary_scaled\"] = (df[\"Salary\"] - df[\"Salary\"].mean()) / df[\"Salary\"].std()   # standardisation\ndf[\"Age_minmax\"] = (df[\"Age\"] - df[\"Age\"].min()) / (df[\"Age\"].max() - df[\"Age\"].min())  # 0 to 1\nprint(df.head())\n", "e05": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\nfrom tensorflow.keras.datasets import cifar10\n\n# 1. Load and prepare CIFAR-10\n(x_train, y_train), (x_test, y_test) = cifar10.load_data()\nx_train = x_train.astype(\"float32\") / 255.0            # scale pixels to 0-1\nx_test = x_test.astype(\"float32\") / 255.0\nx_train = x_train.reshape(-1, 32 * 32 * 3)             # flatten for Dense layers\nx_test = x_test.reshape(-1, 32 * 32 * 3)\n\n# 2. Feed-forward network with three hidden layers\nmodel = keras.Sequential([\n    layers.Dense(512, activation=\"relu\", input_shape=(3072,)),   # hidden layer 1\n    layers.Dense(256, activation=\"relu\"),                        # hidden layer 2\n    layers.Dense(128, activation=\"relu\"),                        # hidden layer 3\n    layers.Dense(10, activation=\"softmax\"),                      # 10 classes\n])\nmodel.compile(optimizer=\"adam\",\n              loss=\"sparse_categorical_crossentropy\",\n              metrics=[\"accuracy\"])\nmodel.summary()\n\n# 3. Train and evaluate\nhistory = model.fit(x_train, y_train, epochs=10, batch_size=128, validation_split=0.1)\ntest_loss, test_acc = model.evaluate(x_test, y_test)\nprint(\"Test accuracy:\", test_acc)\n\n# 4. Plot\nplt.plot(history.history[\"accuracy\"], label=\"train\")\nplt.plot(history.history[\"val_accuracy\"], label=\"validation\")\nplt.xlabel(\"epoch\"); plt.ylabel(\"accuracy\"); plt.legend(); plt.show()\n", "e06": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import make_classification\nfrom sklearn.model_selection import train_test_split\nfrom tensorflow import keras\nfrom tensorflow.keras import layers, regularizers, initializers\n\nX, y = make_classification(n_samples=520, n_features=20, n_informative=8,\n                           n_classes=4, flip_y=0.05)\nX_tr, X_va, y_tr, y_va = train_test_split(X, y, train_size=120)\n\ndef build(init=\"glorot_uniform\", dropout=0.0, l2=0.0, opt=\"adam\"):\n    reg = regularizers.l2(l2) if l2 else None\n    model = keras.Sequential([\n        layers.Dense(64, activation=\"relu\", kernel_initializer=init,\n                     kernel_regularizer=reg, input_shape=(20,)),\n        layers.Dropout(dropout),\n        layers.Dense(64, activation=\"relu\", kernel_initializer=init, kernel_regularizer=reg),\n        layers.Dropout(dropout),\n        layers.Dense(64, activation=\"relu\", kernel_initializer=init, kernel_regularizer=reg),\n        layers.Dense(4, activation=\"softmax\"),\n    ])\n    model.compile(optimizer=opt, loss=\"sparse_categorical_crossentropy\", metrics=[\"accuracy\"])\n    return model\n\ndef train(model, epochs=40):\n    return model.fit(X_tr, y_tr, epochs=epochs, batch_size=32,\n                     validation_data=(X_va, y_va), verbose=0)\n\n# (a) Weight initialisation\ninits = {\"Zeros\": \"zeros\",\n         \"Random N(0,1)\": initializers.RandomNormal(stddev=1.0),\n         \"Xavier (Glorot)\": \"glorot_uniform\",\n         \"Kaiming (He)\": \"he_normal\"}\nfor name, init in inits.items():\n    h = train(build(init=init))\n    plt.plot(h.history[\"val_loss\"], label=name)\n    print(name, \"val_acc =\", h.history[\"val_accuracy\"][-1])\nplt.title(\"Validation loss by initialiser\"); plt.legend(); plt.show()\n\n# (b) Optimisers\noptimizers = {\"SGD\": keras.optimizers.SGD(0.01),\n              \"SGD + momentum\": keras.optimizers.SGD(0.01, momentum=0.9),\n              \"RMSprop\": keras.optimizers.RMSprop(0.003),\n              \"Adam\": keras.optimizers.Adam(0.003)}\nfor name, opt in optimizers.items():\n    h = train(build(init=\"he_normal\", opt=opt))\n    print(name, \"val_acc =\", h.history[\"val_accuracy\"][-1])\n\n# (c) Regularisation: compare the train / validation gap\nsettings = {\"None\": {}, \"L2\": dict(l2=0.01),\n            \"Dropout 0.4\": dict(dropout=0.4), \"L2 + Dropout\": dict(l2=0.005, dropout=0.3)}\nfor name, kw in settings.items():\n    h = train(build(init=\"he_normal\", **kw), epochs=60)\n    gap = h.history[\"accuracy\"][-1] - h.history[\"val_accuracy\"][-1]\n    print(name, \"train - val accuracy gap =\", round(gap, 3))\n", "e07": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\nfrom tensorflow.keras.datasets import mnist\n\n# 1. Load MNIST: 28x28 grey-scale digit images\n(x_train, y_train), (x_test, y_test) = mnist.load_data()\nx_train = x_train.astype(\"float32\")[..., np.newaxis] / 255.0     # (60000, 28, 28, 1)\nx_test = x_test.astype(\"float32\")[..., np.newaxis] / 255.0\n\n# 2. CNN: Conv -> Pool -> Conv -> Pool -> Flatten -> Dense\nmodel = keras.Sequential([\n    layers.Conv2D(32, (3, 3), activation=\"relu\", input_shape=(28, 28, 1)),\n    layers.MaxPooling2D((2, 2)),\n    layers.Conv2D(64, (3, 3), activation=\"relu\"),\n    layers.MaxPooling2D((2, 2)),\n    layers.Flatten(),\n    layers.Dropout(0.5),\n    layers.Dense(10, activation=\"softmax\"),\n])\nmodel.compile(optimizer=\"adam\",\n              loss=\"sparse_categorical_crossentropy\",\n              metrics=[\"accuracy\"])\nmodel.summary()\n\n# 3. Train and evaluate\nhistory = model.fit(x_train, y_train, epochs=5, batch_size=128, validation_split=0.1)\ntest_loss, test_acc = model.evaluate(x_test, y_test)\nprint(\"Test accuracy:\", test_acc)\n\n# 4. Predictions on a few test digits\npred = model.predict(x_test[:12]).argmax(axis=1)\nfor i in range(12):\n    plt.subplot(2, 6, i + 1)\n    plt.imshow(x_test[i].squeeze(), cmap=\"gray\"); plt.title(f\"pred {pred[i]}\"); plt.axis(\"off\")\nplt.show()\n", "e08": "import numpy as np\nimport tensorflow as tf\nimport matplotlib.pyplot as plt\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\nfrom tensorflow.keras.applications import VGG19\nfrom tensorflow.keras.datasets import mnist\n\n# 1. MNIST -> 32x32 RGB images (VGG19 needs 3 channels and at least 32x32)\n(x_train, y_train), (x_test, y_test) = mnist.load_data()\nfrom tensorflow.keras.applications.vgg19 import preprocess_input\ndef prepare(x):\n    x = tf.image.resize(x[..., np.newaxis], (32, 32))          # 28x28 -> 32x32\n    x = tf.image.grayscale_to_rgb(x).numpy()                   # 1 -> 3 channels\n    return preprocess_input(x)                                 # ImageNet preprocessing (0-255 input)\nx_train, y_train = prepare(x_train[:2000]), y_train[:2000]     # a small labelled set\nx_test, y_test = prepare(x_test[:1000]), y_test[:1000]\n\ndef head(base):\n    return keras.Sequential([base, layers.Flatten(),\n                             layers.Dense(128, activation=\"relu\"),\n                             layers.Dropout(0.3),\n                             layers.Dense(10, activation=\"softmax\")])\n\ndef compile_fit(model, lr, epochs):\n    model.compile(optimizer=keras.optimizers.Adam(lr),\n                  loss=\"sparse_categorical_crossentropy\", metrics=[\"accuracy\"])\n    return model.fit(x_train, y_train, epochs=epochs, batch_size=64,\n                     validation_data=(x_test, y_test), verbose=0)\n\n# 2. Baseline: same architecture with random weights (trained from scratch)\nscratch = head(VGG19(weights=None, include_top=False, input_shape=(32, 32, 3)))\nh_scratch = compile_fit(scratch, 1e-3, 10)\n\n# 3. Transfer learning, step 1: pre-trained ImageNet weights, base frozen\nbase = VGG19(weights=\"imagenet\", include_top=False, input_shape=(32, 32, 3))\nbase.trainable = False                                  # feature extraction\nmodel = head(base)\nh_frozen = compile_fit(model, 1e-3, 10)\n\n# 4. Step 2: fine-tune the last convolution block with a small learning rate\nbase.trainable = True\nfor layer in base.layers[:-4]:\n    layer.trainable = False\nh_tuned = compile_fit(model, 1e-5, 5)\n\n# 5. Compare validation accuracy\nplt.plot(h_scratch.history[\"val_accuracy\"], label=\"from scratch\")\nplt.plot(h_frozen.history[\"val_accuracy\"], label=\"VGG19 frozen\")\nplt.plot(range(10, 15), h_tuned.history[\"val_accuracy\"], label=\"fine-tuned\")\nplt.xlabel(\"epoch\"); plt.ylabel(\"val accuracy\"); plt.legend(); plt.show()\n", "e09": "import numpy as np\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\nfrom tensorflow.keras.datasets import imdb\nfrom tensorflow.keras.preprocessing.sequence import pad_sequences\n\n# 1. IMDB reviews, already converted to word indices\n(x_train, y_train), (x_test, y_test) = imdb.load_data(num_words=10000)\nx_train = pad_sequences(x_train, maxlen=200)        # every review = 200 word indices\nx_test = pad_sequences(x_test, maxlen=200)\n\n# 2. Simple RNN for review classification\nmodel = keras.Sequential([\n    layers.Embedding(10000, 32),                     # word index -> 32-number vector\n    layers.SimpleRNN(32),                            # reads the review one word at a time\n    layers.Dense(1, activation=\"sigmoid\"),           # probability of \"positive\"\n])\nmodel.compile(optimizer=\"adam\", loss=\"binary_crossentropy\", metrics=[\"accuracy\"])\nmodel.build(input_shape=(None, 200))\nmodel.summary()\n\n# 3. Train and evaluate\nhistory = model.fit(x_train, y_train, epochs=5, batch_size=64, validation_split=0.2)\ntest_loss, test_acc = model.evaluate(x_test, y_test)\nprint(\"Test accuracy:\", test_acc)\n\n# 4. Predict a few unseen reviews\nprobs = model.predict(x_test[:5]).ravel()\nfor p, label in zip(probs, y_test[:5]):\n    print(f\"P(positive) = {p:.3f}  ->  {'positive' if p > 0.5 else 'negative'}   (true: {label})\")\n", "e10": "import matplotlib.pyplot as plt\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\nfrom tensorflow.keras.datasets import imdb\nfrom tensorflow.keras.preprocessing.sequence import pad_sequences\n\n(x_train, y_train), (x_test, y_test) = imdb.load_data(num_words=10000)\nx_train = pad_sequences(x_train, maxlen=200)\nx_test = pad_sequences(x_test, maxlen=200)\n\ndef build(cell):\n    model = keras.Sequential([\n        layers.Embedding(10000, 32),\n        cell(32),                                    # only this layer changes\n        layers.Dense(1, activation=\"sigmoid\"),\n    ])\n    model.compile(optimizer=\"adam\", loss=\"binary_crossentropy\", metrics=[\"accuracy\"])\n    model.build(input_shape=(None, 200))\n    return model\n\nresults = {}\nfor name, cell in [(\"SimpleRNN\", layers.SimpleRNN), (\"LSTM\", layers.LSTM), (\"GRU\", layers.GRU)]:\n    model = build(cell)\n    history = model.fit(x_train, y_train, epochs=5, batch_size=64,\n                        validation_split=0.2, verbose=0)\n    results[name] = history.history\n    print(f\"{name:10s} params = {model.count_params():,}   \"\n          f\"final val_accuracy = {history.history['val_accuracy'][-1]:.3f}\")\n\nfor name, h in results.items():\n    plt.plot(h[\"val_accuracy\"], label=name)\nplt.xlabel(\"epoch\"); plt.ylabel(\"validation accuracy\"); plt.legend(); plt.show()\n", "e11": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing import MinMaxScaler\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\n\n# 1. NIFTY-50 daily data (columns: Date, Open, High, Low, Close, ...)\ndf = pd.read_csv(\"NIFTY50.csv\", parse_dates=[\"Date\"]).sort_values(\"Date\")\nclose = df[\"Close\"].values.reshape(-1, 1)\n\n# 2. Train / test split, then scale with the TRAIN range only\nsplit = int(len(close) * 0.8)\nscaler = MinMaxScaler()\ntrain_s = scaler.fit_transform(close[:split])\ntest_s = scaler.transform(close[split:])\n\n# 3. Sliding windows: the last 60 days predict the next day\nLOOK_BACK = 60\ndef make_windows(data):\n    X, y = [], []\n    for i in range(LOOK_BACK, len(data)):\n        X.append(data[i - LOOK_BACK:i, 0])\n        y.append(data[i, 0])\n    return np.array(X)[..., np.newaxis], np.array(y)\n\nX_train, y_train = make_windows(train_s)\nX_test, y_test = make_windows(np.concatenate([train_s[-LOOK_BACK:], test_s]))\n\n# 4. LSTM forecaster\nmodel = keras.Sequential([\n    layers.LSTM(50, input_shape=(LOOK_BACK, 1)),\n    layers.Dense(1),\n])\nmodel.compile(optimizer=\"adam\", loss=\"mse\")\nmodel.fit(X_train, y_train, epochs=40, batch_size=16, validation_split=0.1)\n\n# 5. Predict, undo the scaling, measure the error\npred = scaler.inverse_transform(model.predict(X_test))\nactual = scaler.inverse_transform(y_test.reshape(-1, 1))\nrmse = np.sqrt(np.mean((pred - actual) ** 2))\nnaive = np.sqrt(np.mean((actual[1:] - actual[:-1]) ** 2))       # \"tomorrow = today\"\nprint(f\"LSTM RMSE: {rmse:.1f}    naive baseline RMSE: {naive:.1f}\")\n\nplt.plot(actual, label=\"actual\"); plt.plot(pred, label=\"LSTM prediction\")\nplt.legend(); plt.title(\"NIFTY-50 Close: test period\"); plt.show()\n"};

    };
    const t0 = performance.now();
    await ctx.yield();
    try { await R[part.runner](ctx); }
    catch (err) { if (alive()) { st.logs.push(["Error: " + (err && err.message || err), "bad"]); if (live()) addLine(ui, "Error: " + (err && err.message || err), "bad"); console.error(err); } }
    if (!alive()) return;
    st.status = "done"; st.ms = performance.now() - t0; ui.bar.style.width = "100%";
    if (live()) { setStatus(ui, st); setTimeout(() => { if (live()) ui.bar.style.width = "0%"; }, 700); }
    markRan(partOf[part.id]);
  }

  function markRan(x) {
    const b = $('.nav[data-exp="' + x.n + '"]'); if (b) b.classList.add("ran");
  }

  function renderExperiment(n, pi) {
    const x = EXP.find((e) => e.n === n) || EXP[0];
    const part = x.parts[Math.min(pi || 0, x.parts.length - 1)], st = runState[part.id];
    const topicCount = BANK.filter((q) => q.exp === x.n).length;
    main.innerHTML =
      '<div class="view">' +
      '<div class="exp-head"><div class="exp-no">' + String(x.n).padStart(2, "0") + "</div><div><h2>" + esc(x.title) + '</h2><p class="aim">' + esc(x.aim) + "</p></div></div>" +
      (x.parts.length > 1 ? '<div class="parts" role="group" aria-label="Parts of this experiment">' + x.parts.map((p, i) => '<button class="pill" data-part="' + i + '" aria-pressed="' + (p === part) + '">' + esc(p.label) + "</button>").join("") + "</div>" : "") +
      '<div class="grid">' +
      '<section class="card" aria-label="Code"><div class="card-bar"><div class="tabs" role="tablist">' +
      part.codes.map((c, i) => '<button class="tab" role="tab" data-tab="' + i + '" aria-selected="' + (i === (st.tab < part.codes.length ? st.tab : 0)) + '">' + esc(c.label) + "</button>").join("") +
      '</div><button class="btn" data-copy>' + ICON.copy + ' <span>Copy</span></button></div><div class="code-wrap"><pre class="code" tabindex="0"></pre></div><div class="live-note" data-codenote hidden></div></section>' +
      '<section class="card" aria-label="Live result"><div class="card-bar out-bar"><span class="status"><i></i><span data-status>Ready</span></span>' +
      '<div class="out-actions"><label class="seed"><input type="checkbox" data-lock> same data <b data-seed></b></label><button class="btn primary" data-run></button></div></div>' +
      '<div class="progress"><i></i></div><div class="stats"></div><div class="console" role="log" aria-live="off"></div>' +
      '<div class="live-note"><b>Live run, in your browser.</b> ' + esc(part.live) + '</div><div class="charts"></div><div class="out-pad"></div></section>' +
      "</div>" +
      '<section class="card viva-strip"><div><h3>Viva talking points</h3><ul>' + part.points.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul></div>" +
      '<a class="btn primary" href="#/quiz/' + x.n + '">' + ICON.quiz + " Quiz me · " + topicCount + " MCQs</a></section>" +
      (() => { const i = EXP.indexOf(x), pv = EXP[i - 1], nx = EXP[i + 1];
        return '<nav class="exp-pager" aria-label="Other experiments">' +
          (pv ? '<a class="prev" href="#/exp/' + pv.n + '"><small>← Previous</small><b>' + String(pv.n).padStart(2, "0") + " · " + esc(pv.title) + "</b></a>" : "") +
          (nx ? '<a class="next" href="#/exp/' + nx.n + '"><small>Next →</small><b>' + String(nx.n).padStart(2, "0") + " · " + esc(nx.title) + "</b></a>" : '<a class="next" href="#/quiz"><small>Next →</small><b>Viva MCQs</b></a>') +
          "</nav>"; })() +
      '<p class="foot">The results above are produced by a small deep-learning engine written in JavaScript (real forward and backward passes) running in this page. It mirrors the Keras code shown here, but datasets are generated stand-ins, because MNIST, CIFAR-10, IMDB and NIFTY-50 cannot be downloaded here. Every run starts from fresh random data, so the numbers change each time.</p>' +
      "</div>";

    const ui = {
      part, console: $(".console"), stats: $(".stats"), charts: $(".charts"), bar: $(".progress i"), status: $(".out-bar .status"), statusText: $("[data-status]"),
      run: $("[data-run]"), seedVal: $("[data-seed]"), lock: $("[data-lock]"), cursor: Object.assign(document.createElement("span"), { className: "cursor" }),
    };
    current = ui; Charts.reset();
    ui.console.appendChild(ui.cursor);
    ui.lock.checked = st.lock; ui.seedVal.textContent = st.seed != null ? st.seed : "";
    ui.lock.addEventListener("change", () => { st.lock = ui.lock.checked; });
    ui.run.addEventListener("click", () => { if (st.status !== "run") runPart(part, ui); });

    /* code tabs */
    const pre = $("pre.code"), note = $("[data-codenote]");
    const showTab = (i) => {
      st.tab = i; const c = part.codes[i];
      pre.innerHTML = highlight(CODE[c.file] || "# code not found"); pre.parentNode.scrollTop = 0;
      $$(".tab").forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
      note.hidden = !c.noRun; note.textContent = c.noRun ? "Reference version. The live run on the right follows the other tab." : "";
    };
    $$(".tab").forEach((b) => b.addEventListener("click", () => showTab(+b.dataset.tab)));
    showTab(st.tab < part.codes.length ? st.tab : 0);
    $("[data-copy]").addEventListener("click", (ev) => {
      const btn = ev.currentTarget, text = CODE[part.codes[st.tab < part.codes.length ? st.tab : 0].file] || "";
      const done = () => { btn.innerHTML = ICON.check + " <span>Copied</span>"; setTimeout(() => { btn.innerHTML = ICON.copy + " <span>Copy</span>"; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done);
    });
    $$(".pill").forEach((b) => b.addEventListener("click", () => { location.hash = "#/exp/" + x.n + "/" + b.dataset.part; }));

    /* replay a finished run, or start one */
    if (st.status === "done") {
      st.logs.forEach(([t, c]) => addLine(ui, t, c)); st.stats.forEach(([l, v, tone]) => addStat(ui, l, v, tone)); st.charts.forEach((s) => Charts.add(ui.charts, s));
      setStatus(ui, st);
    } else { setStatus(ui, st); runPart(part, ui); }
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ } ta.remove();
  }

  /* ===================================================================
     Quiz
     =================================================================== */
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const topicName = (id) => (TOPICS.find((t) => t.id === id) || {}).name || "Topic " + id;

  function renderQuizSetup(preTopic) {
    const prefs = Object.assign({ topics: TOPICS.map((t) => t.id), count: 20, pdfOnly: false }, store.get("quizPrefs", {}));
    if (preTopic) prefs.topics = [preTopic];
    const best = store.get("quizBest", null);
    const pool = () => BANK.filter((q) => prefs.topics.includes(q.exp) && (!prefs.pdfOnly || q.pdf));
    main.innerHTML =
      '<div class="view quiz"><div class="q-hero"><h2>Viva practice</h2><p>' + BANK.length + " multiple-choice questions on every experiment and on the concepts in your viva PDF. Options are shuffled each time, and every answer comes with a short explanation.</p></div>" +
      '<div class="card q-card"><h3>1 · Choose topics</h3><div class="topics">' +
      TOPICS.map((t) => '<button class="topic" data-t="' + t.id + '" aria-pressed="' + prefs.topics.includes(t.id) + '"><span class="no">' + t.id + '</span><span class="nm">' + esc(t.name) + '</span><span class="ct">' + BANK.filter((q) => q.exp === t.id).length + "</span></button>").join("") +
      '</div><div class="row"><button class="btn" data-all>Select all</button><button class="btn" data-none>Clear</button></div></div>' +
      '<div class="card q-card"><h3>2 · Options</h3><div class="row" style="margin-top:0"><span>Questions</span><div class="seg" role="group" aria-label="Number of questions">' +
      [10, 20, 30, 0].map((c) => '<button data-c="' + c + '" aria-pressed="' + (prefs.count === c) + '">' + (c || "All") + "</button>").join("") + '</div>' +
      '<label class="check"><input type="checkbox" data-pdf ' + (prefs.pdfOnly ? "checked" : "") + '> Only questions from the viva PDF</label></div>' +
      '<div class="start-row"><button class="btn primary big" data-start>' + ICON.play + ' Start quiz</button><span class="best" data-avail></span>' +
      (best ? '<span class="best">Best score: <b>' + best.pct + "%</b> on " + best.n + " questions</span>" : "") + "</div></div></div>";
    const refresh = () => {
      const n = pool().length; $("[data-avail]").textContent = n + " questions in this selection";
      $("[data-start]").disabled = n === 0; store.set("quizPrefs", prefs);
      $$(".topic").forEach((b) => b.setAttribute("aria-pressed", String(prefs.topics.includes(+b.dataset.t))));
      $$(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(prefs.count === +b.dataset.c)));
    };
    $$(".topic").forEach((b) => b.addEventListener("click", () => { const id = +b.dataset.t; prefs.topics = prefs.topics.includes(id) ? prefs.topics.filter((v) => v !== id) : prefs.topics.concat(id); refresh(); }));
    $("[data-all]").addEventListener("click", () => { prefs.topics = TOPICS.map((t) => t.id); refresh(); });
    $("[data-none]").addEventListener("click", () => { prefs.topics = []; refresh(); });
    $$(".seg button").forEach((b) => b.addEventListener("click", () => { prefs.count = +b.dataset.c; refresh(); }));
    $("[data-pdf]").addEventListener("change", (e) => { prefs.pdfOnly = e.target.checked; refresh(); });
    $("[data-start]").addEventListener("click", () => { const p = shuffle(pool()); startQuiz(prefs.count ? p.slice(0, prefs.count) : p); });
    refresh();
  }

  function startQuiz(list) {
    const S = { items: list.map((q) => { const opts = shuffle([q.ok].concat(q.bad)); return { q, opts, right: opts.indexOf(q.ok), picked: -1 }; }), i: 0, score: 0, streak: 0, best: 0 };
    const total = S.items.length;
    const onKey = (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const it = S.items[S.i]; if (!it) return;
      const k = e.key.toLowerCase(), idx = "1234".includes(k) && k ? +k - 1 : "abcd".indexOf(k);
      if (it.picked < 0 && idx >= 0 && idx < it.opts.length && k.length === 1) { e.preventDefault(); pick(idx); }
      else if (it.picked >= 0 && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { e.preventDefault(); next(); }
    };
    document.addEventListener("keydown", onKey); quizCleanup = () => document.removeEventListener("keydown", onKey);

    function show() {
      const it = S.items[S.i], q = it.q;
      main.innerHTML =
        '<div class="view quiz"><div class="card q-card"><div class="play-top"><div class="bar"><i></i></div><div class="meta"><span>Q ' + (S.i + 1) + "/" + total + "</span><span>Score " + S.score + "</span><span>Streak " + S.streak + "</span></div></div>" +
        '<div><span class="tag">' + esc(topicName(q.exp)) + "</span> " + (q.pdf ? '<span class="tag pdf">Viva PDF</span>' : "") + "</div>" +
        '<div class="q-text">' + esc(q.text) + '</div><div class="opts">' +
        it.opts.map((o, k) => '<button class="opt" data-k="' + k + '"><span class="k">' + "ABCD"[k] + "</span><span>" + esc(o) + "</span></button>").join("") +
        '</div><div data-why></div><div class="next-row"><span class="kbd">Keys: 1–4 to answer · Enter for next</span><button class="btn primary" data-next hidden></button></div></div></div>';
      requestAnimationFrame(() => { $(".bar i").style.width = Math.round((S.i / total) * 100) + "%"; });
      $$(".opt").forEach((b) => b.addEventListener("click", () => pick(+b.dataset.k)));
      $("[data-next]").addEventListener("click", next);
    }
    function pick(k) {
      const it = S.items[S.i]; if (it.picked >= 0) return;
      it.picked = k; const ok = k === it.right;
      if (ok) { S.score++; S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
      $$(".opt").forEach((b, i) => { b.disabled = true; if (i === it.right) b.classList.add("right"); else if (i === k) b.classList.add("wrong"); else b.classList.add("dim"); });
      $("[data-why]").innerHTML = '<div class="why"><div class="verdict ' + (ok ? "good" : "bad") + '">' + (ok ? (S.streak >= 3 ? "Correct · " + S.streak + " in a row!" : "Correct!") : "Not quite.") + "</div>" + esc(it.q.why) + "</div>";
      const nb = $("[data-next]"); nb.hidden = false; nb.textContent = S.i === total - 1 ? "See results" : "Next question"; nb.focus({ preventScroll: true });
      $(".meta").innerHTML = "<span>Q " + (S.i + 1) + "/" + total + "</span><span>Score " + S.score + "</span><span>Streak " + S.streak + "</span>";
      $(".bar i").style.width = Math.round(((S.i + 1) / total) * 100) + "%";
    }
    function next() {
      if (S.i < total - 1) {
        const scrollY = window.scrollY;
        S.i++;
        show();
        requestAnimationFrame(() => window.scrollTo({ top: scrollY, left: 0, behavior: "instant" }));
      } else results();
    }

    function results() {
      const pct = Math.round((S.score / total) * 100);
      if (total >= 10) { const b = store.get("quizBest", null); if (!b || pct > b.pct) store.set("quizBest", { pct, n: total }); }
      const byTopic = {}; S.items.forEach((it) => { const t = (byTopic[it.q.exp] = byTopic[it.q.exp] || { n: 0, ok: 0 }); t.n++; if (it.picked === it.right) t.ok++; });
      const missed = S.items.filter((it) => it.picked !== it.right);
      const msg = pct >= 90 ? "Viva ready!" : pct >= 70 ? "Good going" : pct >= 50 ? "Getting there" : "Keep revising";
      const sub = pct >= 90 ? "You know this material well." : pct >= 70 ? "A little more polish on the topics below." : "Review the explanations of the missed questions below, then try again.";
      main.innerHTML =
        '<div class="view quiz"><div class="card q-card"><div class="res"><div class="ring"><svg viewBox="0 0 168 168"><circle class="bg" cx="84" cy="84" r="70"/><circle class="fg" cx="84" cy="84" r="70"/></svg><div class="num"><div><b data-pct>0%</b><br><span>' + S.score + " / " + total + '</span></div></div></div>' +
        "<div><h2>" + msg + "</h2><p>" + sub + " Longest streak: " + S.best + ".</p></div></div></div>" +
        '<div class="card q-card"><h3>By topic</h3><div class="by-topic">' +
        Object.keys(byTopic).map((id) => { const t = byTopic[id], p = Math.round((t.ok / t.n) * 100); return '<div class="bt"><span class="nm" title="' + esc(topicName(+id)) + '">' + esc(topicName(+id)) + '</span><span class="tr"><i class="' + (p < 50 ? "low" : p < 75 ? "mid" : "") + '" data-w="' + p + '"></i></span><span class="sc">' + t.ok + "/" + t.n + "</span></div>"; }).join("") + "</div></div>" +
        (missed.length ? '<div class="card q-card"><h3>Review the ' + missed.length + " you missed</h3><div class=\"missed\">" +
          missed.map((it) => "<details><summary>" + esc(it.q.text) + '</summary><div class="ans"><span class="y">Your answer: ' + esc(it.picked >= 0 ? it.opts[it.picked] : "(skipped)") + '</span><span class="c">Correct: ' + esc(it.opts[it.right]) + "</span><span>" + esc(it.q.why) + "</span></div></details>").join("") + "</div></div>" : "") +
        '<div class="start-row">' + (missed.length ? '<button class="btn primary big" data-retry>Retry the missed ones</button>' : "") + '<button class="btn big" data-new>New quiz</button></div></div>';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const circ = 2 * Math.PI * 70; $(".ring .fg").style.strokeDasharray = (circ * pct) / 100 + " 1000";
        $$(".tr i").forEach((i) => { i.style.width = i.dataset.w + "%"; });
        const el = $("[data-pct]"), t0 = performance.now(); const tick = (now) => { const t = reduceMotion() ? 1 : Math.max(0, Math.min(1, (now - t0) / 1000)); el.textContent = Math.round(pct * (1 - Math.pow(1 - t, 3))) + "%"; if (t < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick);
      }));
      const r = $("[data-retry]"); if (r) r.addEventListener("click", () => { cleanup(); startQuiz(shuffle(missed.map((it) => it.q))); });
      $("[data-new]").addEventListener("click", () => { cleanup(); renderQuizSetup(); });
      window.scrollTo(0, 0);
    }
    function cleanup() { if (quizCleanup) { quizCleanup(); quizCleanup = null; } }
    show();
  }

  /* ===================================================================
     Rail, theme, router
     =================================================================== */
  function buildRail() {
    rail.innerHTML = '<div class="rail-label">Lab experiments</div>' +
      EXP.map((x) => '<button class="nav" data-exp="' + x.n + '"><span class="no">' + x.n + '</span><span class="tt">' + esc(x.short) + '</span><span class="dot"></span></button>').join("") +
      '<div class="rail-label">Viva</div><button class="nav nav-quiz" data-quiz><span class="no">?</span><span class="tt">Viva MCQs<small>' + BANK.length + " questions</small></span></button>";
    $$(".nav[data-exp]", rail).forEach((b) => b.addEventListener("click", () => { location.hash = "#/exp/" + b.dataset.exp; }));
    $("[data-quiz]", rail).addEventListener("click", () => { location.hash = "#/quiz"; });
  }
  function setCurrentNav(kind, n) {
    $$(".nav", rail).forEach((b) => b.removeAttribute("aria-current"));
    const b = kind === "quiz" ? $("[data-quiz]", rail) : $('.nav[data-exp="' + n + '"]', rail);
    if (b) { b.setAttribute("aria-current", "page"); if (b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "center" }); }
  }
  function route() {
    stopCurrent(); if (quizCleanup) { quizCleanup(); quizCleanup = null; }
    const [kind, a, b] = location.hash.replace(/^#\/?/, "").split("/");
    window.scrollTo(0, 0);
    if (kind === "quiz") { setCurrentNav("quiz"); renderQuizSetup(a ? +a : 0); }
    else { const n = +a || 1; setCurrentNav("exp", n); renderExperiment(n, +b || 0); }
    document.title = (kind === "quiz" ? "Viva MCQs" : "Experiment " + (+a || 1)) + " · Deep Learning Lab";
  }
  function initTheme() {
    const root = document.documentElement, btn = $("#theme");
    const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const sync = () => { btn.innerHTML = dark() ? ICON.sun : ICON.moon; btn.setAttribute("aria-label", dark() ? "Switch to light theme" : "Switch to dark theme"); };
    const saved = store.get("theme", null); if (saved) root.dataset.theme = saved;
    sync();
    btn.addEventListener("click", () => { const t = dark() ? "light" : "dark"; root.dataset.theme = t; store.set("theme", t); sync(); Charts.redrawAll(); });
    if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { sync(); Charts.redrawAll(); });
  }

  buildRail(); initTheme();
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
