<style>
/* Deep Learning Lab — monochrome "boutique app" look:
   off-white canvas, white rounded cards, near-black banners and pills, condensed all-caps headings.
   Motion: staggered reveals, banner glow drift, chevron trails, ripples, code-line cascade. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f6f6f5; --surface-3: #ececea;
  --ink: #1b1e1f; --ink-2: #3b3f41; --muted: #74787b; --line: #e8e8e6; --line-2: #d3d3d0; --grid: #efefed;
  --dark: #ffffff; --dark-2: #f4f4f3; --dark-3: #e6e6e4; --on-dark: #1b1e1f; --on-dark-muted: #74787b;
  --accent: #1b1e1f; --accent-hover: #000000; --accent-ink: #ffffff; --accent-soft: #f2f2f0; --accent-line: #d3d3d0;
  --pop: #d7392b; --pop-soft: #fde8e5;
  --c1: #1d2122; --c2: #d7392b; --c3: #4f7f9a; --c4: #8a5a9e; --c5: #8b9092;
  --good: #23784a; --bad: #c0352a; --warn: #9a6614; --good-soft: #e5f3ea; --bad-soft: #fde8e5; --warn-soft: #faf0de;
  --term-bg: #111314; --term-line: #111314; --term-ink: #f1f1ee; --term-dim: #8f979a; --term-ok: #8fe0a8; --term-bad: #ff8f80; --term-warn: #f4cb83; --term-head: #9fd1ff;
  --code-bg: #fafaf9; --code-ink: #1b1e1f; --code-gutter: #a7acae;
  --tk-c: #8a9295; --tk-s: #2c7a4b; --tk-k: #7a3cc2; --tk-n: #b4530f; --tk-f: #1f62b8;
  --img-bg: #1b1e1f; --img-fg: #ffffff;
  --shadow-sm: 0 1px 2px rgba(20, 22, 23, .05);
  --shadow: 0 2px 6px rgba(20, 22, 23, .04), 0 14px 34px rgba(20, 22, 23, .07);
  --shadow-lg: 0 18px 50px rgba(20, 22, 23, .14);
  --radius: 24px; --radius-sm: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --font-display: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top-h: 72px;
  color-scheme: light;
}
/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top-h) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; transition: background .4s, color .4s; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
::selection { background: var(--ink); color: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .01em; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
p { margin: 0; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 80; padding: 8px 12px; background: var(--ink); color: var(--bg); border-radius: 999px; }
.skip:focus { left: 8px; }
main:focus { outline: none; }
noscript { display: block; padding: 24px; }

/* ---------- motion primitives ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.85); } 70% { opacity: 1; transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes slideRight { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
@keyframes titleIn { from { clip-path: inset(0 0 100% 0); transform: translateY(40%); } to { clip-path: inset(0 0 -10% 0); transform: none; } }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 18px) scale(1.12); } 100% { transform: translate(0, 0) scale(1); } }
@keyframes gridMove { to { background-position: 28px 28px; } }
@keyframes sheen { 0% { transform: translateX(-120%) skewX(-18deg); } 60%, 100% { transform: translateX(260%) skewX(-18deg); } }
@keyframes chev { 0%, 100% { opacity: .25; transform: translateX(0); } 50% { opacity: 1; transform: translateX(3px); } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes ripple { from { transform: scale(0); opacity: .35; } to { transform: scale(2.6); opacity: 0; } }
@keyframes marqueeUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@keyframes marqueeDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(215, 57, 43, .45); } 50% { box-shadow: 0 0 0 7px rgba(215, 57, 43, 0); } }

/* scroll / render reveal (class added by script; uses `translate` so it never fights hover transforms) */
.reveal { opacity: 0; translate: 0 26px; }
.reveal.in { opacity: 1; translate: 0 0; transition: opacity .7s var(--ease) var(--d, 0ms), translate .8s var(--ease) var(--d, 0ms), transform .25s var(--ease), border-color .2s, background .2s, box-shadow .25s; }
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; animation: ripple .65s ease-out forwards; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 40; height: var(--top-h); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 clamp(16px, 3vw, 36px); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-bottom: 1px solid transparent; transition: border-color .3s, box-shadow .3s; animation: fadeIn .6s both; }
.top.scrolled { border-bottom-color: var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .05); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; width: 46px; height: 46px; padding: 8px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-sm); transition: transform .5s var(--spring); }
.brand:hover svg { transform: rotate(-12deg) scale(1.06); }
.brand p { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.brand h1 { font-size: 1.65rem; line-height: 1; letter-spacing: .02em; animation: slideRight .7s var(--ease) .1s both; }
.logo-line { stroke: var(--line-2); stroke-width: 1.2; }
.logo-node { fill: var(--ink); transform-box: fill-box; transform-origin: center; animation: nodePulse 2.6s ease-in-out infinite; }
.logo-node:nth-of-type(2n) { fill: var(--pop); }
@keyframes nodePulse { 0%, 100% { transform: scale(1); opacity: .75; } 50% { transform: scale(1.35); opacity: 1; } }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { position: relative; overflow: hidden; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: transform .3s var(--spring), border-color .2s, background .2s; }
.icon-btn:hover { transform: translateY(-2px); border-color: var(--ink); }
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: popIn .5s var(--spring); }
#theme svg { transition: transform .6s var(--spring); }
#theme:hover svg { transform: rotate(40deg); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: clamp(20px, 3vw, 44px); max-width: 1660px; margin: 0 auto; padding: 18px clamp(16px, 3vw, 36px) 40px; }
.rail { position: sticky; top: calc(var(--top-h) + 14px); align-self: start; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - var(--top-h) - 32px); overflow-y: auto; padding: 4px 6px 4px 2px; scrollbar-width: thin; }
.rail-label { font: 400 1.05rem/1 var(--font-display); letter-spacing: .06em; color: var(--muted); margin: 6px 12px 6px; }
.rail-label:not(:first-child) { margin-top: 18px; }
.nav { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 14px 7px 7px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; text-align: left; color: var(--ink-2);
  transition: background .3s var(--ease), border-color .3s, color .3s, transform .3s var(--spring); animation: slideRight .55s var(--ease) both; }
.nav:nth-child(2) { animation-delay: .04s; } .nav:nth-child(3) { animation-delay: .08s; } .nav:nth-child(4) { animation-delay: .12s; } .nav:nth-child(5) { animation-delay: .16s; } .nav:nth-child(6) { animation-delay: .2s; }
.nav:nth-child(7) { animation-delay: .24s; } .nav:nth-child(8) { animation-delay: .28s; } .nav:nth-child(9) { animation-delay: .32s; } .nav:nth-child(10) { animation-delay: .36s; } .nav:nth-child(11) { animation-delay: .4s; } .nav:nth-child(12) { animation-delay: .44s; } .nav:nth-child(14) { animation-delay: .5s; }
.nav:hover { border-color: var(--ink); color: var(--ink); transform: translateX(4px); }
.nav .no { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 .74rem var(--font-mono); background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); transition: inherit; }
.nav .tt { min-width: 0; font-weight: 600; font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; line-height: 1.2; }
.nav .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: transparent; flex: none; transition: transform .4s var(--spring); }
.nav.ran .dot { background: var(--pop); animation: breathe 2.4s infinite; }
.nav[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--bg); box-shadow: var(--shadow); }
.nav[aria-current="page"] .no { background: var(--bg); color: var(--ink); border-color: transparent; }
.nav[aria-current="page"]:hover { transform: none; }
.nav-quiz { padding: 9px 14px 9px 9px; background: var(--surface); color: var(--ink); border-color: var(--pop); border-radius: 22px; }
.nav-quiz:hover { color: var(--ink); border-color: var(--pop); }
.nav-quiz .no { background: var(--pop); color: #fff; border-color: transparent; animation: floaty 2.8s ease-in-out infinite; }
.nav-quiz .tt small { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--on-dark-muted); font-size: .74rem; }
.nav-quiz[aria-current="page"] { background: var(--pop); border-color: var(--pop); color: #fff; box-shadow: 0 8px 22px rgba(215, 57, 43, .28); }
.nav-quiz[aria-current="page"] .tt small { color: rgba(255, 255, 255, .8); }
.nav-quiz[aria-current="page"] .no { background: #fff; color: var(--pop); }

main { min-width: 0; }
.view { animation: fadeIn .35s ease both; }

/* ---------- experiment banner (dark hero card) ---------- */
.exp-head { position: relative; isolation: isolate; overflow: hidden; display: flex; gap: 22px; align-items: flex-end; margin-bottom: 18px; padding: clamp(22px, 3vw, 34px);
  border-radius: 28px; background: var(--dark); color: var(--on-dark); border: 1px solid var(--line); box-shadow: var(--shadow); animation: fadeUp .7s var(--ease) both; }
.exp-head::before { content: ""; position: absolute; z-index: -1; width: 420px; height: 420px; right: -90px; top: -160px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--pop) 22%, transparent) 0%, transparent 65%); filter: blur(10px); animation: drift 12s ease-in-out infinite; }
.exp-head::after { content: ""; position: absolute; z-index: -1; inset: 0; opacity: .14;
  background-image: radial-gradient(rgba(27, 30, 31, .7) 1px, transparent 1.4px); background-size: 28px 28px;
  mask-image: linear-gradient(105deg, transparent 35%, #000 85%); -webkit-mask-image: linear-gradient(105deg, transparent 35%, #000 85%); animation: gridMove 6s linear infinite; }
.exp-no { flex: none; font: 400 clamp(4.2rem, 3rem + 4vw, 7rem)/.8 var(--font-display); color: transparent; -webkit-text-stroke: 1.5px var(--pop); letter-spacing: .02em; animation: popIn .8s var(--spring) .1s both; }
.exp-head h2 { font-size: clamp(2.3rem, 1.6rem + 2.6vw, 4rem); line-height: .92; color: var(--on-dark); animation: titleIn .8s var(--ease) .15s both; }
.aim { color: var(--on-dark-muted); margin-top: 10px; max-width: 64ch; font-size: .95rem; animation: fadeUp .7s var(--ease) .3s both; }
.parts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.pill { position: relative; overflow: hidden; padding: 10px 20px; border-radius: 999px; border: 1.5px solid var(--line-2); background: transparent; font-weight: 600; font-size: .8rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2);
  transition: background .3s var(--ease), color .3s, border-color .3s, transform .3s var(--spring); animation: popIn .5s var(--spring) both; }
.pill:nth-child(2) { animation-delay: .07s; } .pill:nth-child(3) { animation-delay: .14s; }
.pill:hover { border-color: var(--ink); color: var(--ink); transform: translateY(-2px); }
.pill[aria-pressed="true"], .pill[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* ---------- cards & grid ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid > .card:first-child { position: sticky; top: calc(var(--top-h) + 14px); }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-width: 0; transition: transform .35s var(--ease), box-shadow .35s; }
.card-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 12px 14px; background: var(--surface); flex-wrap: wrap; min-height: 64px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.code-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.code-actions .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab { position: relative; overflow: hidden; padding: 8px 15px; border-radius: 999px; border: 1.5px solid var(--line-2); background: transparent; font: 600 .74rem var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); transition: all .3s var(--ease); }
.tab:hover { color: var(--ink); border-color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; white-space: nowrap;
  transition: transform .3s var(--spring), border-color .2s, background .25s, color .25s, box-shadow .3s; }
.btn:hover { border-color: var(--ink); transform: translateY(-2px); }
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { box-shadow: 0 10px 24px rgba(0, 0, 0, .18); }
.btn.primary::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .28), transparent); animation: sheen 3.6s ease-in-out infinite; pointer-events: none; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; transition: transform .35s var(--spring); }
.btn:hover svg { transform: scale(1.15) rotate(-8deg); }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn.big { padding: 15px 28px; font-size: .9rem; }
.btn.big[disabled] { opacity: .4; cursor: not-allowed; }
.btn.big.primary::before { content: "› › ›"; order: 2; margin-left: 4px; font-size: 1.05rem; letter-spacing: .02em; animation: chev 1.4s ease-in-out infinite; }
.spin { animation: spin .8s linear infinite; }

/* code: dark editor with a line cascade */
.code-wrap { max-height: calc(100vh - var(--top-h) - 140px); min-height: 280px; overflow: auto; overscroll-behavior: contain; background: var(--code-bg); margin: 0 10px 10px; border-radius: 18px; scrollbar-width: thin; scrollbar-color: #c9cccd var(--code-bg); border: 1px solid var(--line); }
pre.code { display: block; width: max-content; min-width: 100%; margin: 0; padding: 18px 20px 22px 10px; color: var(--code-ink); font: 400 13px/1.8 var(--font-mono); tab-size: 4; font-variant-ligatures: none; counter-reset: ln; }
pre.code .l { display: block; position: relative; white-space: pre; min-height: 1.8em; padding-left: 3.6em; padding-right: 16px; animation: slideRight .45s var(--ease) both; animation-delay: calc(var(--n, 0) * 16ms); transition: background .2s; }
pre.code .l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 2.4em; text-align: right; color: var(--code-gutter); font-size: 11.5px; user-select: none; }
pre.code .l:hover { background: rgba(27, 30, 31, .04); }
pre.code .l:hover::before { color: var(--pop); }
.tk-c { color: var(--tk-c); font-style: italic; } .tk-s { color: var(--tk-s); } .tk-k { color: var(--tk-k); font-weight: 500; } .tk-n { color: var(--tk-n); } .tk-f { color: var(--tk-f); }

/* result panel: the dark "add to cart" style control bar */
.out-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "status run" "seed run"; align-items: center; column-gap: 12px; row-gap: 4px; margin: 10px 10px 0; padding: 10px 10px 10px 20px; border-radius: 22px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.out-bar .status { grid-area: status; }
.out-bar .out-actions { display: contents; }
.out-bar .seed { grid-area: seed; }
.out-bar [data-run] { grid-area: run; }
.out-bar .status { display: inline-flex; align-items: center; gap: 9px; font: 400 1.15rem/1 var(--font-display); letter-spacing: .05em; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--on-dark-muted); }
.status.run i { background: var(--pop); animation: blink .9s infinite; }
.status.done i { background: var(--good); box-shadow: 0 0 0 4px var(--good-soft); animation: popIn .5s var(--spring); }
.out-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seed { font: 500 .72rem var(--font-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seed b { font-weight: 500; opacity: .75; }
.seed input { accent-color: var(--pop); width: 14px; height: 14px; margin: 0; }
.out-bar .btn.primary { background: var(--pop); color: #fff; border-color: var(--pop); padding: 12px 20px; }
.progress { height: 3px; margin: 8px 24px 0; border-radius: 999px; background: transparent; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--pop), #ff7a6b, var(--pop)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; transition: width .25s ease-out; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 0; }
.stats .chip { flex: 1 1 120px; }
.stats:empty { display: none; }
.chip { display: flex; flex-direction: column; gap: 3px; padding: 11px 14px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); animation: popIn .55s var(--spring) both; min-width: 0; transition: transform .3s var(--spring); }
.chip:nth-child(2) { animation-delay: .08s; } .chip:nth-child(3) { animation-delay: .16s; } .chip:nth-child(4) { animation-delay: .24s; } .chip:nth-child(5) { animation-delay: .32s; }
.chip:hover { transform: translateY(-3px); }
.chip small { font-size: .64rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip b { font: 400 1.7rem/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chip.ok { background: var(--ink); border-color: var(--ink); } .chip.ok small { color: var(--bg); opacity: .65; } .chip.ok b { color: var(--bg); }
.chip.warn { background: var(--warn-soft); border-color: transparent; } .chip.warn b { color: var(--warn); }
.console { margin: 12px 14px 0; padding: 16px 18px; background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--term-line); border-radius: 18px; font: 400 .8rem/1.7 var(--font-mono); max-height: 440px; overflow: auto; scrollbar-width: thin; scrollbar-color: #4a5154 var(--term-bg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); }
.console .ln { white-space: pre; width: max-content; min-width: 100%; animation: slideRight .3s var(--ease) both; min-height: 1.65em; }
.console .dim { color: var(--term-dim); } .console .ok { color: var(--term-ok); } .console .bad { color: var(--term-bad); } .console .warn { color: var(--term-warn); } .console .head { color: var(--term-head); font-weight: 600; }
.console .cursor { display: inline-block; width: .55em; height: 1em; background: var(--term-ink); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
.live-note { margin: 12px 14px 0; padding: 12px 16px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); font-size: .82rem; line-height: 1.55; color: var(--ink-2); }
.live-note b { color: var(--ink); text-transform: uppercase; letter-spacing: .04em; font-size: .74rem; }
.live-note[hidden] { display: none; }
.code-wrap + .live-note { margin: 0 10px 10px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; padding: 12px 14px 0; }
.charts:empty { display: none; }
.chart { position: relative; margin: 0; padding: 14px 14px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); min-width: 0; }
.chart.wide { grid-column: 1 / -1; }
.chart figcaption { font: 400 1.15rem/1.1 var(--font-display); letter-spacing: .03em; margin-bottom: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; }
.chart canvas { display: block; width: 100%; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px 8px; padding-top: 6px; }
.imgs figure { margin: 0; text-align: center; animation: popIn .5s var(--spring) both; }
.imgs canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 10px; background: var(--img-bg); transition: transform .3s var(--spring); }
.imgs figure:hover canvas { transform: scale(1.08); }
.imgs figcaption { font: 500 .68rem var(--font-mono); margin: 3px 0 0; color: var(--muted); line-height: 1.25; }
.imgs .bad figcaption { color: var(--bad); font-weight: 600; }
.imgs .bad canvas { outline: 2px solid var(--bad); outline-offset: 1px; }
.out-pad { height: 14px; }
.tip { position: absolute; pointer-events: none; z-index: 4; padding: 7px 11px; border-radius: 12px; background: var(--ink); color: var(--bg); font: 500 .72rem/1.5 var(--font-mono); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; white-space: nowrap; box-shadow: var(--shadow); }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* viva talking points */
.viva-strip { margin-top: 18px; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 24px; align-items: start; }
.viva-strip > .btn { margin-top: 4px; }
.viva-strip h3 { font-size: 2rem; margin-bottom: 14px; }
.viva-strip ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; counter-reset: pt; }
.viva-strip li { counter-increment: pt; position: relative; padding: 52px 16px 16px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--line); font-size: .88rem; line-height: 1.55; color: var(--ink-2); transition: transform .35s var(--spring), border-color .25s, background .25s; }
.viva-strip li:hover { transform: translateY(-4px) rotate(-.4deg); border-color: var(--ink); background: var(--surface); }
.viva-strip li::before { content: "0" counter(pt); position: absolute; left: 16px; top: 12px; font: 400 2rem/1 var(--font-display); color: var(--ink); opacity: .9; }
.exp-pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.exp-pager a { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 0; max-width: 380px; padding: 16px 24px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; box-shadow: var(--shadow); transition: transform .35s var(--spring), box-shadow .3s; }
.exp-pager a:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.exp-pager a.next { margin-left: auto; text-align: right; }
.exp-pager a.prev { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line-2); }
.exp-pager small { font-size: .66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; opacity: .7; }
.exp-pager b { font: 400 1.3rem/1.05 var(--font-display); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; line-height: 1.65; max-width: 100ch; }

/* ---------- aim + algorithm card ---------- */
.algo { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 2fr); gap: 0; margin-bottom: 18px; }
.algo h3 { font-size: 1.6rem; margin-bottom: 10px; }
.algo-aim { padding: 22px 24px; background: var(--surface-2); border-right: 1px solid var(--line); }
.algo-aim h3 { color: var(--pop); }
.algo-aim p { font-size: .95rem; line-height: 1.65; color: var(--ink-2); }
.algo-steps { padding: 22px 24px; }
.algo-steps > ol { list-style: none; margin: 0; padding: 0; counter-reset: st; display: grid; gap: 8px; }
.algo-steps > ol > li { counter-increment: st; position: relative; padding: 3px 0 3px 42px; font-size: .9rem; line-height: 1.55; color: var(--ink-2); min-height: 28px; }
.algo-steps > ol > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 .74rem var(--font-mono); background: var(--ink); color: var(--bg); }
.algo-steps ol[type="a"] { margin: 6px 0 2px; padding-left: 20px; display: grid; gap: 4px; list-style: lower-alpha; }
.algo-steps ol[type="a"] li { padding-left: 4px; font-size: .88rem; }
.algo-steps ol[type="a"] li::marker { color: var(--pop); font-weight: 600; }
@media (max-width: 900px) {
  .algo { grid-template-columns: minmax(0, 1fr); }
  .algo-aim { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 560px) { .algo-aim, .algo-steps { padding: 18px; } }

/* ---------- easy-to-remember strip (inside the aim/algorithm card) ---------- */
.memo { grid-column: 1 / -1; display: grid; gap: 14px; padding: 22px 24px 24px; border-top: 1px solid var(--line); background: linear-gradient(180deg, var(--pop-soft), var(--surface) 70%); }
.memo-head h3 { font-size: 1.15rem; color: var(--pop); margin-bottom: 4px; letter-spacing: .06em; }
.memo-tip { font: 400 clamp(1.7rem, 1.3rem + 1.4vw, 2.4rem)/1.05 var(--font-display); letter-spacing: .01em; text-transform: uppercase; color: var(--ink); }
.memo-how { margin-top: 6px; font-size: .88rem; color: var(--muted); }
.memo-flow { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.memo-flow > i { align-self: center; font-style: normal; font-weight: 700; color: var(--pop); }
.mf { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); transition: transform .3s var(--spring), border-color .2s; }
.mf:hover { transform: translateY(-3px); border-color: var(--ink); }
.mf b { font: 600 .68rem var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--pop); }
.mf span { font: 400 .8rem/1.55 var(--font-mono); color: var(--ink-2); }
.memo-keys, .memo-keras { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.memo-keys b, .memo-keras b { font: 600 .68rem var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.memo-keys span { padding: 5px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 500 .76rem var(--font-mono); }
.memo-keras span { font: 600 .8rem var(--font-body); color: var(--ink-2); }
.memo-keras em { font-style: normal; color: var(--pop); font-weight: 800; font-size: .95rem; }
.memo-keras i { font-style: normal; color: var(--line-2); }
.memo-keras small { flex-basis: 100%; font-size: .78rem; color: var(--muted); font-style: italic; }
@media (max-width: 900px) { .memo-flow { flex-direction: column; } .memo-flow > i { transform: rotate(90deg); } .mf { flex: none; } }
@media (max-width: 560px) { .memo { padding: 18px; } }

/* ---------- quiz ---------- */
.quiz { max-width: 860px; margin-inline: auto; }
.q-hero { position: relative; isolation: isolate; overflow: hidden; padding: clamp(24px, 3.4vw, 40px); border-radius: 28px; background: var(--dark); color: var(--on-dark); border: 1px solid var(--line); box-shadow: var(--shadow); animation: fadeUp .7s var(--ease) both; }
.q-hero::before { content: ""; position: absolute; z-index: -1; width: 380px; height: 380px; right: -80px; bottom: -200px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--pop) 22%, transparent), transparent 65%); animation: drift 11s ease-in-out infinite; }
.q-hero h2 { font-size: clamp(2.8rem, 2rem + 3vw, 4.6rem); line-height: .9; color: var(--on-dark); animation: titleIn .8s var(--ease) .1s both; }
.q-hero p { color: var(--on-dark-muted); margin-top: 12px; max-width: 58ch; font-size: .95rem; animation: fadeUp .7s var(--ease) .25s both; }
.q-card { margin-top: 18px; padding: clamp(18px, 2.6vw, 28px); }
.q-card h3 { font-size: 1.6rem; margin-bottom: 14px; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; }
.topic { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 7px; border-radius: 999px; border: 1.5px solid var(--line-2); background: transparent; text-align: left; transition: background .3s var(--ease), border-color .3s, color .3s, transform .3s var(--spring); }
.topic:hover { border-color: var(--ink); transform: translateY(-2px); }
.topic .no { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 .72rem var(--font-mono); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); transition: inherit; }
.topic .nm { min-width: 0; font-size: .84rem; line-height: 1.3; font-weight: 600; }
.topic .ct { margin-left: auto; font: 500 .72rem var(--font-mono); color: var(--muted); }
.topic[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.topic[aria-pressed="true"] .no { background: var(--bg); color: var(--ink); border-color: transparent; }
.topic[aria-pressed="true"] .ct { color: var(--bg); opacity: .65; }
.row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-top: 16px; }
.seg { display: inline-flex; gap: 10px; }
.seg button { position: relative; overflow: hidden; width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); font: 600 .9rem var(--font-body); color: var(--ink-2); transition: background .3s var(--ease), color .3s, border-color .3s, transform .35s var(--spring); }
.seg button:hover { border-color: var(--ink); transform: translateY(-3px); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); transform: scale(1.06); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
.check input { accent-color: var(--ink); width: 17px; height: 17px; margin: 0; }
.best { color: var(--muted); font-size: .85rem; }
.best b { color: var(--ink); }
.start-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 22px; }

.play-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; padding: 8px 8px 8px 18px; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.bar { flex: 1 1 160px; height: 8px; border-radius: 999px; background: var(--dark-3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--pop), #ff7a6b, var(--pop)); background-size: 200% 100%; animation: shimmer 2s linear infinite; transition: width .6s var(--spring); }
.meta { font: 500 .76rem var(--font-mono); color: var(--on-dark-muted); display: flex; gap: 6px; flex-wrap: wrap; }
.meta span { padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); animation: popIn .45s var(--spring) both; }
.tag { display: inline-block; padding: 4px 12px; border-radius: 999px; background: transparent; border: 1.5px solid var(--line-2); font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); animation: popIn .45s var(--spring) both; }
.tag.pdf { background: var(--pop); color: #fff; border-color: var(--pop); }
.q-text { font: 400 clamp(1.9rem, 1.4rem + 1.6vw, 2.7rem)/1.02 var(--font-display); letter-spacing: .01em; text-transform: uppercase; margin: 16px 0 20px; text-wrap: balance; animation: titleIn .65s var(--ease) both; }
.opts { display: grid; gap: 10px; }
.opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 18px 10px 10px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); text-align: left; line-height: 1.4; font-weight: 500;
  transition: border-color .25s, background .25s, color .25s, transform .3s var(--spring); animation: fadeUp .5s var(--ease) both; }
.opt:nth-child(2) { animation-delay: .06s; } .opt:nth-child(3) { animation-delay: .12s; } .opt:nth-child(4) { animation-delay: .18s; }
.opt:hover:not([disabled]) { border-color: var(--ink); transform: translateX(6px); }
.opt:active:not([disabled]) { transform: scale(.98); }
.opt .k { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 600 .82rem var(--font-body); background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); transition: all .3s var(--spring); }
.opt:hover:not([disabled]) .k { background: var(--ink); color: var(--bg); transform: rotate(-10deg); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); animation: pulse .5s var(--spring); }
.opt.right .k { background: var(--good); color: #fff; border-color: var(--good); transform: scale(1.1); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s; }
.opt.wrong .k { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt.dim { opacity: .45; transform: scale(.985); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes pulse { 40% { transform: scale(1.025); } }
.why { margin-top: 16px; padding: 16px 20px; border-radius: 22px; background: var(--surface-2); border: 1px solid var(--line); line-height: 1.6; animation: fadeUp .45s var(--ease) both; }
.why .verdict { font: 400 1.6rem/1 var(--font-display); letter-spacing: .02em; margin-bottom: 6px; animation: popIn .5s var(--spring) both; }
.why .verdict.good { color: var(--good); } .why .verdict.bad { color: var(--bad); }
.next-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.next-row .btn.primary:not([hidden]) { animation: popIn .45s var(--spring) both; padding: 14px 24px; }
.kbd { font: 500 .72rem var(--font-mono); color: var(--muted); }

.res { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
.ring { position: relative; width: 160px; height: 160px; animation: popIn .8s var(--spring) both; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; }
.ring .bg { stroke: var(--grid); }
.ring .fg { stroke: var(--pop); stroke-linecap: round; stroke-dasharray: 0 1000; transition: stroke-dasharray 1.3s var(--ease); }
.ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .num b { font: 400 3rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ring .num span { font-size: .8rem; color: var(--muted); }
.res h2 { font-size: 3rem; animation: titleIn .7s var(--ease) .2s both; }
.res p { color: var(--muted); margin-top: 8px; }
.by-topic { display: grid; gap: 10px; }
.bt { display: grid; grid-template-columns: minmax(90px, 230px) minmax(0, 1fr) 50px; gap: 12px; align-items: center; font-size: .86rem; font-weight: 500; }
.bt .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt .tr { height: 10px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.bt .tr i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--ink); transition: width 1.1s var(--spring); }
.bt .tr i.low { background: var(--bad); } .bt .tr i.mid { background: #e0913b; }
.bt .sc { font: 500 .78rem var(--font-mono); text-align: right; color: var(--muted); }
.missed { display: grid; gap: 8px; }
.missed details { border: 1px solid var(--line); border-radius: 20px; padding: 14px 18px; background: var(--surface); transition: background .25s, border-color .25s; }
.missed details[open] { background: var(--surface-2); border-color: var(--line-2); }
.missed summary { cursor: pointer; font-weight: 600; line-height: 1.45; }
.missed .ans { margin-top: 10px; font-size: .9rem; display: grid; gap: 5px; animation: fadeUp .35s var(--ease) both; }
.missed .y { color: var(--bad); } .missed .c { color: var(--good); font-weight: 600; }

/* ---------- footer credit ---------- */
.made-by-ananth { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 8px 18px 30px; color: var(--muted); font: 600 11px/1.4 var(--font-body); letter-spacing: .16em; text-transform: uppercase; }
.made-by-ananth::before, .made-by-ananth::after { content: ""; width: 22px; height: 1.5px; background: var(--pop); }
.made-by-ananth strong { color: var(--pop); font-weight: 700; }

/* ---------- mobile dock (dark tab bar with white pill) ---------- */
.dock { display: none; }
@media (max-width: 900px) {
  .dock { position: fixed; z-index: 45; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; align-items: center; gap: 4px; padding: 7px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(20, 22, 23, .14); width: min(calc(100% - 28px), 420px); justify-content: space-between; animation: dockIn .7s var(--spring) .3s both; }
  @keyframes dockIn { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: none; } }
  .dock a { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; min-width: 52px; padding: 0 16px; border-radius: 999px; color: var(--on-dark); text-decoration: none; font: 600 .74rem var(--font-body); letter-spacing: .06em; text-transform: uppercase; transition: background .35s var(--ease), color .35s, flex-grow .45s var(--spring); }
  .dock a span { display: none; }
  .dock a.on { background: var(--ink); color: #fff; flex-grow: 1; }
  .dock a.on span { display: inline; animation: slideRight .35s var(--ease) both; }
  .dock a[aria-disabled="true"] { opacity: .3; pointer-events: none; }
  .dock svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .dock a:active { transform: scale(.92); }
  body { padding-bottom: 92px; }
}

/* ---------- intro screen (shown once per visit when opened without a link) ---------- */
.intro { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #fff; color: var(--ink); overflow: hidden; animation: fadeIn .4s both; }
.intro.bye { animation: introOut .7s var(--ease) forwards; }
@keyframes introOut { to { opacity: 0; transform: scale(1.04); visibility: hidden; } }
.intro-kicker { position: absolute; z-index: 3; top: max(28px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font: 400 clamp(1.6rem, 4vw, 2.4rem)/1 var(--font-display); letter-spacing: .32em; text-indent: .32em; animation: fadeUp .9s var(--ease) .2s both; text-shadow: 0 2px 14px #fff, 0 0 2px #fff; }
.intro-mosaic { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 12px; overflow: hidden; mask-image: linear-gradient(#000 60%, transparent); -webkit-mask-image: linear-gradient(#000 60%, transparent); }
.intro-col { display: flex; flex-direction: column; gap: 12px; animation: marqueeUp 26s linear infinite; }
.intro-col:nth-child(2) { animation-name: marqueeDown; animation-duration: 30s; }
.intro-col:nth-child(3) { animation-duration: 22s; }
.intro-tile { position: relative; overflow: hidden; flex: none; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px;
  background: linear-gradient(160deg, #f7f7f6, #e9e9e7); border: 1px solid var(--line); }
.intro-tile:nth-child(3n) { min-height: 210px; background: linear-gradient(160deg, #fff1ef, #fbd9d4); border-color: #f6c9c3; }

<script>
/* =========================================================================
   engine-core.js — a tiny deep-learning engine in plain JavaScript.
   Layers: Dense, Dropout, Conv2D, MaxPool2D, Embedding, SimpleRNN, LSTM, GRU
   Optimisers: SGD, SGD+momentum, RMSprop, Adam.  Losses: cce, bce, mse.
   Everything is real forward/backward maths (gradient-checked in tests).
   ========================================================================= */
(function (G) {
  "use strict";

  /* ---------- helpers ---------- */
  const sum = (a) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; };
  const mean = (a) => sum(a) / a.length;
  const std1 = (a) => { const m = mean(a); let s = 0; for (const v of a) s += (v - m) * (v - m); return Math.sqrt(s / (a.length - 1)); };
  const quantile = (sorted, q) => { const p = (sorted.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return sorted[lo] + (sorted[hi] - sorted[lo]) * (p - lo); };
  const fx = (x, d = 4) => Number(x).toFixed(d);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ---------- seeded random numbers ---------- */
  function makeRng(seed) {
    let a = seed >>> 0, spare = null;
    const next = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const randn = () => {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = next();
      const v = next(), m = Math.sqrt(-2 * Math.log(u));
      spare = m * Math.sin(2 * Math.PI * v);
      return m * Math.cos(2 * Math.PI * v);
    };
    const r = {
      next, randn,
      int: (n) => Math.floor(next() * n),
      uniform: (lo, hi) => lo + (hi - lo) * next(),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
      perm(n) { const p = new Array(n); for (let i = 0; i < n; i++) p[i] = i; return r.shuffle(p); },
    };
    return r;
  }

  /* ---------- activations & initialisers ---------- */
  const ACT = {
    linear: { f: (z) => z, d: () => 1 },
    relu: { f: (z) => (z > 0 ? z : 0), d: (a) => (a > 0 ? 1 : 0) },
    tanh: { f: Math.tanh, d: (a) => 1 - a * a },
    sigmoid: { f: (z) => 1 / (1 + Math.exp(-z)), d: (a) => a * (1 - a) },
  };

  function initW(W, nin, nout, kind, rng, std) {
    const n = W.length;
    switch (kind) {
      case "zeros": break;
      case "normal": for (let i = 0; i < n; i++) W[i] = rng.randn() * (std == null ? 0.05 : std); break;      case "glorot_normal": { const s = Math.sqrt(2 / (nin + nout)); for (let i = 0; i < n; i++) W[i] = rng.randn() * s; break; }
      case "he_normal": { const s = Math.sqrt(2 / nin); for (let i = 0; i < n; i++) W[i] = rng.randn() * s; break; }
      case "he_uniform": { const l = Math.sqrt(6 / nin); for (let i = 0; i < n; i++) W[i] = rng.uniform(-l, l); break; }
      default: { const l = Math.sqrt(6 / (nin + nout)); for (let i = 0; i < n; i++) W[i] = rng.uniform(-l, l); }
    }
  }

  /* ---------- layers ---------- */
  class DenseL {
    constructor(nin, nout, o, rng) {
      o = o || {};
      this.kind = "dense"; this.nin = nin; this.nout = nout; this.act = o.act || "linear"; this.l2 = o.l2 || 0;
      this.W = new Float64Array(nin * nout); this.b = new Float64Array(nout);
      this.gW = new Float64Array(nin * nout); this.gb = new Float64Array(nout);
      initW(this.W, nin, nout, o.init || "glorot_uniform", rng, o.std);
      this.trainable = true;
    }
    paramCount() { return this.nin * this.nout + this.nout; }
    params() { return [{ w: this.W, g: this.gW }, { w: this.b, g: this.gb }]; }
    forward(x, n) {
      this.x = x; this.n = n;
      const { nin, nout, W, b } = this, out = new Float64Array(n * nout);
      for (let i = 0; i < n; i++) {
        const xo = i * nin, oo = i * nout;
        for (let j = 0; j < nout; j++) out[oo + j] = b[j];
        for (let k = 0; k < nin; k++) {
          const xv = x[xo + k]; if (xv === 0) continue;
          const wo = k * nout;
          for (let j = 0; j < nout; j++) out[oo + j] += xv * W[wo + j];
        }
      }
      if (this.act === "softmax") {
        for (let i = 0; i < n; i++) {
          const o = i * nout; let mx = -Infinity;
          for (let j = 0; j < nout; j++) if (out[o + j] > mx) mx = out[o + j];
          let s = 0;
          for (let j = 0; j < nout; j++) { const e = Math.exp(out[o + j] - mx); out[o + j] = e; s += e; }
          for (let j = 0; j < nout; j++) out[o + j] /= s;
        }
      } else if (this.act !== "linear") {
        const f = ACT[this.act].f;
        for (let i = 0; i < out.length; i++) out[i] = f(out[i]);
      }
      this.out = out; return out;
    }
    backward(dy, n, skipAct, needDx) {
      const { nin, nout, W, gW, gb, x } = this;
      let dz = dy;
      if (!skipAct && this.act !== "linear") {
        if (this.act === "softmax") throw new Error("softmax needs the combined cross-entropy gradient");
        dz = new Float64Array(dy.length);
        const d = ACT[this.act].d;
        for (let i = 0; i < dy.length; i++) dz[i] = dy[i] * d(this.out[i]);
      }
      gW.fill(0); gb.fill(0);
      for (let i = 0; i < n; i++) {
        const xo = i * nin, zo = i * nout;
        for (let j = 0; j < nout; j++) gb[j] += dz[zo + j];
        for (let k = 0; k < nin; k++) {
          const xv = x[xo + k]; if (xv === 0) continue;
          const go = k * nout;
          for (let j = 0; j < nout; j++) gW[go + j] += xv * dz[zo + j];
        }
      }
      if (this.l2) for (let i = 0; i < W.length; i++) gW[i] += 2 * this.l2 * W[i];
      if (!needDx) return null;
      const dx = new Float64Array(n * nin);
      for (let i = 0; i < n; i++) {
        const xo = i * nin, zo = i * nout;
        for (let k = 0; k < nin; k++) {
          let s = 0; const wo = k * nout;
          for (let j = 0; j < nout; j++) s += dz[zo + j] * W[wo + j];
          dx[xo + k] = s;
        }
      }
      return dx;
    }
    l2Loss() { if (!this.l2) return 0; let s = 0; for (let i = 0; i < this.W.length; i++) s += this.W[i] * this.W[i]; return this.l2 * s; }
  }

  class DropL {
    constructor(rate, rng) { this.kind = "dropout"; this.rate = rate; this.rng = rng; this.trainable = true; }
    paramCount() { return 0; }
    params() { return []; }
    forward(x, n, train) {
      if (!train || this.rate === 0) { this.mask = null; return x; }
      const out = new Float64Array(x.length), m = new Float64Array(x.length), keep = 1 - this.rate, sc = 1 / keep;
      for (let i = 0; i < x.length; i++) { if (this.rng.next() < keep) { m[i] = sc; out[i] = x[i] * sc; } }
      this.mask = m; return out;
    }
    backward(dy) {
      if (!this.mask) return dy;
      const dx = new Float64Array(dy.length);
      for (let i = 0; i < dy.length; i++) dx[i] = dy[i] * this.mask[i];
      return dx;
    }
  }

  class ConvL {
    constructor(h, w, cin, cout, k, o, rng) {
      o = o || {};
      this.kind = "conv"; this.h = h; this.w = w; this.cin = cin; this.cout = cout; this.k = k;
      this.oh = h - k + 1; this.ow = w - k + 1; this.relu = o.act === "relu";
      this.W = new Float64Array(cout * cin * k * k); this.b = new Float64Array(cout);
      this.gW = new Float64Array(this.W.length); this.gb = new Float64Array(cout);
      const lim = Math.sqrt(6 / ((cin + cout) * k * k));
      for (let i = 0; i < this.W.length; i++) this.W[i] = rng.uniform(-lim, lim);
      this.trainable = true;
    }
    paramCount() { return this.cout * this.cin * this.k * this.k + this.cout; }
    params() { return [{ w: this.W, g: this.gW }, { w: this.b, g: this.gb }]; }
    forward(x, n) {
      this.x = x; this.n = n;
      const { h, w, cin, cout, k, oh, ow, W, b } = this, out = new Float64Array(n * cout * oh * ow);
      for (let s = 0; s < n; s++) for (let co = 0; co < cout; co++) {
        for (let oy = 0; oy < oh; oy++) for (let ox = 0; ox < ow; ox++) {
          let sm = b[co];
          for (let ci = 0; ci < cin; ci++) for (let ky = 0; ky < k; ky++) {
            const xi = ((s * cin + ci) * h + oy + ky) * w + ox, wi = ((co * cin + ci) * k + ky) * k;
            for (let kx = 0; kx < k; kx++) sm += x[xi + kx] * W[wi + kx];
          }
          out[((s * cout + co) * oh + oy) * ow + ox] = this.relu ? (sm > 0 ? sm : 0) : sm;
        }
      }
      this.out = out; return out;
    }
    backward(dy, n, _s, needDx) {
      const { h, w, cin, cout, k, oh, ow, W, gW, gb, x, out } = this;
      gW.fill(0); gb.fill(0);
      const dx = needDx ? new Float64Array(n * cin * h * w) : null;
      for (let s = 0; s < n; s++) for (let co = 0; co < cout; co++) {
        for (let oy = 0; oy < oh; oy++) for (let ox = 0; ox < ow; ox++) {
          const oi = ((s * cout + co) * oh + oy) * ow + ox;
          if (this.relu && out[oi] <= 0) continue;
          const g = dy[oi]; if (g === 0) continue;
          gb[co] += g;
          for (let ci = 0; ci < cin; ci++) for (let ky = 0; ky < k; ky++) {
            const xi = ((s * cin + ci) * h + oy + ky) * w + ox, wi = ((co * cin + ci) * k + ky) * k;
            for (let kx = 0; kx < k; kx++) {
              gW[wi + kx] += g * x[xi + kx];
              if (dx) dx[xi + kx] += g * W[wi + kx];
            }
          }
        }
      }
      return dx;
    }
  }

  class PoolL {
    constructor(h, w, c) { this.kind = "pool"; this.h = h; this.w = w; this.c = c; this.oh = h >> 1; this.ow = w >> 1; this.trainable = true; }
    paramCount() { return 0; }
    params() { return []; }
    forward(x, n) {
      const { h, w, c, oh, ow } = this, out = new Float64Array(n * c * oh * ow), arg = new Int32Array(out.length);
      let o = 0;
      for (let s = 0; s < n; s++) for (let ch = 0; ch < c; ch++) for (let oy = 0; oy < oh; oy++) for (let ox = 0; ox < ow; ox++, o++) {
        let best = -Infinity, bi = 0;
        for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
          const idx = ((s * c + ch) * h + oy * 2 + dy) * w + ox * 2 + dx;
          if (x[idx] > best) { best = x[idx]; bi = idx; }
        }
        out[o] = best; arg[o] = bi;
      }
      this.arg = arg; this.n = n; return out;
    }
    backward(dy, n, _s, needDx) {
      if (!needDx) return null;
      const dx = new Float64Array(n * this.c * this.h * this.w);
      for (let o = 0; o < dy.length; o++) dx[this.arg[o]] += dy[o];
      return dx;
    }
  }

  class EmbL {
    constructor(V, d, T, rng) {
      this.kind = "embedding"; this.V = V; this.d = d; this.T = T;
      this.E = new Float64Array(V * d); this.gE = new Float64Array(V * d);
      for (let i = 0; i < this.E.length; i++) this.E[i] = rng.uniform(-0.05, 0.05);
      this.trainable = true;
    }
    paramCount() { return this.V * this.d; }
    params() { return [{ w: this.E, g: this.gE }]; }
    forward(x, n) {
      this.x = x; const { d, T, E } = this, out = new Float64Array(n * T * d);
      for (let i = 0; i < n * T; i++) { const id = x[i] * d; for (let k = 0; k < d; k++) out[i * d + k] = E[id + k]; }
      return out;
    }
    backward(dy, n) {
      const { d, T, gE, x } = this; gE.fill(0);
      for (let i = 0; i < n * T; i++) { const id = x[i] * d; for (let k = 0; k < d; k++) gE[id + k] += dy[i * d + k]; }
      return null;
    }
  }

  /* SimpleRNN / LSTM / GRU — return the last hidden state (n x H) */
  const sig = (z) => 1 / (1 + Math.exp(-z));
  class RecL {
    constructor(type, F, H, T, rng) {
