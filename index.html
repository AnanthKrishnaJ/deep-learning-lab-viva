<style>
/* Deep Learning Lab — one stylesheet.
   Layout: sticky top bar, left rail (experiment index), main column.
   Experiment page = code (always dark) beside a live-result console, then viva talking points.
   Quiz = one focused column. Light theme by default; dark via system preference or the toggle. */
:root {
  --bg: #faf9f7; --surface: #ffffff; --surface-2: #f4f2ee; --surface-3: #ece9e3;
  --ink: #1b1a18; --ink-2: #3b3934; --muted: #6c675f; --line: #e5e0d8; --line-2: #d6d0c6; --grid: #eeeae4;
  --accent: #c2362b; --accent-hover: #a82c22; --accent-ink: #ffffff; --accent-soft: #fbebe8; --accent-line: #f0c7c1;
  --c1: #c2362b; --c2: #b27a28; --c3: #33698f; --c4: #8a4c7c; --c5: #78726a;
  --good: #1f7a4a; --bad: #b8322a; --warn: #9a6614; --good-soft: #e5f3ea; --bad-soft: #fbe9e7; --warn-soft: #fbf1df;
  --term-bg: #121413; --term-line: #262a28; --term-ink: #ecebe5; --term-dim: #8f978f; --term-ok: #95dcaa; --term-bad: #ff998b; --term-warn: #f5cd83; --term-head: #9fd3e6;
  --code-bg: #161917; --code-ink: #eeede6; --code-gutter: #6f7a72;
  --tk-c: #8f9b92; --tk-s: #b8e0a2; --tk-k: #e0b0ff; --tk-n: #ffbd84; --tk-f: #8fd3ff;
  --img-bg: #121413; --img-fg: #f4f2ec;
  --shadow-sm: 0 1px 2px rgba(27, 26, 24, .05);
  --shadow: 0 1px 2px rgba(27, 26, 24, .04), 0 6px 20px rgba(27, 26, 24, .05);
  --radius: 12px; --radius-sm: 8px;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131211; --surface: #1b1a18; --surface-2: #22211e; --surface-3: #2b2a26;
    --ink: #f2efe9; --ink-2: #d9d5cd; --muted: #a29d94; --line: #2f2d29; --line-2: #3d3a35; --grid: #2a2825;
    --accent: #f0715a; --accent-hover: #f58a76; --accent-ink: #1b1110; --accent-soft: #3a211c; --accent-line: #5c3027;
    --c1: #f0715a; --c2: #e0b45e; --c3: #7fb6da; --c4: #d48cc4; --c5: #9b968d;
    --good: #7fd29c; --bad: #ff8b7d; --warn: #e9bd6b; --good-soft: #17301f; --bad-soft: #3a1d1a; --warn-soft: #352a15;
    --term-bg: #0d0e0d; --term-line: #232622; --code-bg: #101210;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131211; --surface: #1b1a18; --surface-2: #22211e; --surface-3: #2b2a26;
  --ink: #f2efe9; --ink-2: #d9d5cd; --muted: #a29d94; --line: #2f2d29; --line-2: #3d3a35; --grid: #2a2825;
  --accent: #f0715a; --accent-hover: #f58a76; --accent-ink: #1b1110; --accent-soft: #3a211c; --accent-line: #5c3027;
  --c1: #f0715a; --c2: #e0b45e; --c3: #7fb6da; --c4: #d48cc4; --c5: #9b968d;
  --good: #7fd29c; --bad: #ff8b7d; --warn: #e9bd6b; --good-soft: #17301f; --bad-soft: #3a1d1a; --warn-soft: #352a15;
  --term-bg: #0d0e0d; --term-line: #232622; --code-bg: #101210;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top-h) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent); color: var(--accent-ink); }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
p { margin: 0; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 50; padding: 8px 12px; background: var(--ink); color: var(--bg); border-radius: 8px; }
.skip:focus { left: 8px; }
main:focus { outline: none; }
noscript { display: block; padding: 24px; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 clamp(16px, 3vw, 32px); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; width: 34px; height: 34px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.brand h1 { font-size: 1.02rem; font-weight: 700; line-height: 1.15; letter-spacing: -.03em; }
.brand p { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo-line { stroke: var(--line-2); stroke-width: 1.2; }
.logo-node { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: nodePulse 3s ease-in-out infinite; }
.logo-node:nth-of-type(2n) { fill: var(--ink); }
@keyframes nodePulse { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.3); opacity: 1; } }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: border-color .15s, background .15s; }
.icon-btn:hover { border-color: var(--line-2); background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: clamp(20px, 3vw, 44px); max-width: 1640px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px) 40px; }
.rail { position: sticky; top: calc(var(--top-h) + 20px); align-self: start; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - var(--top-h) - 40px); overflow-y: auto; padding: 2px 4px 2px 2px; scrollbar-width: thin; }
.rail-label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 6px 10px 6px; }
.rail-label:not(:first-child) { margin-top: 18px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid transparent; background: transparent; text-align: left; color: var(--ink-2); transition: background .15s, border-color .15s, color .15s; }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav .no { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 .72rem var(--font-mono); background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); transition: inherit; }
.nav .tt { min-width: 0; font-weight: 500; font-size: .9rem; line-height: 1.25; }
.nav .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: transparent; flex: none; }
.nav.ran .dot { background: var(--good); }
.nav[aria-current="page"] { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow-sm); }
.nav[aria-current="page"] .no { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.nav-quiz { padding: 10px 12px; background: var(--ink); color: var(--bg); border-radius: 11px; }
.nav-quiz:hover { background: var(--ink); color: var(--bg); filter: brightness(1.15); }
.nav-quiz .no { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.nav-quiz .tt { font-weight: 600; }
.nav-quiz .tt small { display: block; font-weight: 400; opacity: .7; font-size: .74rem; }
.nav-quiz[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

main { min-width: 0; }
.view { animation: rise .4s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- experiment page ---------- */
.exp-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 20px; }
.exp-no { flex: none; min-width: 3ch; padding: 4px 8px; margin-top: 6px; border-radius: 8px; font: 600 .85rem/1.2 var(--font-mono); text-align: center; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); }
.exp-head h2 { font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem); line-height: 1.08; font-weight: 700; letter-spacing: -.035em; }
.aim { color: var(--muted); margin-top: 8px; max-width: 72ch; font-size: 1rem; }
.parts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 18px; padding: 4px; width: fit-content; max-width: 100%; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.pill { padding: 6px 13px; border-radius: 8px; border: 1px solid transparent; background: transparent; font-weight: 500; font-size: .86rem; color: var(--muted); transition: background .15s, color .15s; }
.pill:hover { color: var(--ink); }
.pill[aria-pressed="true"], .pill[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-sm); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid > .card:first-child { position: sticky; top: calc(var(--top-h) + 20px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.card-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; min-height: 54px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; padding: 3px; border-radius: 9px; background: var(--surface-2); }
.tab { padding: 5px 11px; border-radius: 7px; border: 1px solid transparent; background: transparent; font: 500 .78rem var(--font-mono); color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow-sm); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: .86rem; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-sm); transition: transform .12s, border-color .15s, background .15s, box-shadow .15s; }
.btn:hover { border-color: var(--line-2); background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn.big { padding: 11px 20px; font-size: .98rem; border-radius: 11px; }
.btn.big[disabled] { opacity: .45; cursor: not-allowed; }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* code: always a dark editor, horizontal scroll instead of wrapping */
.code-wrap { max-height: calc(100vh - var(--top-h) - 120px); min-height: 280px; overflow: auto; overscroll-behavior: contain; background: var(--code-bg); scrollbar-width: thin; scrollbar-color: #4a524c var(--code-bg); }
pre.code { display: block; width: max-content; min-width: 100%; margin: 0; padding: 16px 20px 20px 10px; color: var(--code-ink); font: 400 13px/1.75 var(--font-mono); tab-size: 4; font-variant-ligatures: none; counter-reset: ln; }
pre.code .l { display: block; position: relative; white-space: pre; min-height: 1.75em; padding-left: 3.6em; padding-right: 16px; }
pre.code .l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 2.4em; text-align: right; color: var(--code-gutter); font-size: 11.5px; user-select: none; }
pre.code .l:hover { background: rgba(255, 255, 255, .035); }
.tk-c { color: var(--tk-c); font-style: italic; } .tk-s { color: var(--tk-s); } .tk-k { color: var(--tk-k); font-weight: 500; } .tk-n { color: var(--tk-n); } .tk-f { color: var(--tk-f); }

/* result panel */
.out-bar .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .85rem; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 3px var(--surface-2); }
.status.run i { background: var(--c2); animation: blink 1s infinite; }
.status.done i { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
@keyframes blink { 50% { opacity: .25; } }
.out-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seed { font: 500 .75rem var(--font-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.seed input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
.progress { height: 2px; background: var(--grid); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease-out; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 14px 14px 0; }
.stats:empty { display: none; }
.chip { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); animation: pop .35s cubic-bezier(.2, .9, .3, 1.2) both; min-width: 0; }
.chip small { font-size: .66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip b { font: 700 1.1rem/1.2 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chip.ok { background: var(--good-soft); border-color: transparent; } .chip.ok b { color: var(--good); }
.chip.warn { background: var(--warn-soft); border-color: transparent; } .chip.warn b { color: var(--warn); }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(3px); } to { opacity: 1; transform: none; } }

.console { margin: 14px 14px 0; padding: 12px 14px; background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--term-line); border-radius: 10px; font: 400 .76rem/1.6 var(--font-mono); max-height: 420px; overflow: auto; scrollbar-width: thin; scrollbar-color: #4a524c var(--term-bg); }
.console .ln { white-space: pre-wrap; overflow-wrap: anywhere; animation: lnIn .24s ease-out both; min-height: 1.6em; }
@keyframes lnIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
.console .dim { color: var(--term-dim); } .console .ok { color: var(--term-ok); } .console .bad { color: var(--term-bad); } .console .warn { color: var(--term-warn); } .console .head { color: var(--term-head); font-weight: 600; }
.console .cursor { display: inline-block; width: .55em; height: 1em; background: var(--term-ink); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
.live-note { margin: 14px 14px 0; padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--accent); font-size: .82rem; line-height: 1.55; color: var(--ink-2); }
.live-note b { color: var(--ink); }
.live-note[hidden] { display: none; }
.code-wrap + .live-note { margin: 0; border-radius: 0; border-left: 0; border-top: 1px solid var(--line); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; padding: 14px 14px 0; }
.charts:empty { display: none; }
.chart { position: relative; margin: 0; padding: 12px 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; animation: rise .45s both; }
.chart.wide { grid-column: 1 / -1; }
.chart figcaption { font: 600 .86rem/1.3 var(--font-body); margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .74rem; color: var(--muted); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; }
.chart canvas { display: block; width: 100%; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px 8px; padding-top: 6px; }
.imgs figure { margin: 0; text-align: center; }
.imgs canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; background: var(--img-bg); }
.imgs figcaption { font: 500 .68rem var(--font-mono); margin: 3px 0 0; color: var(--muted); line-height: 1.25; }
.imgs .bad figcaption { color: var(--bad); font-weight: 600; }
.imgs .bad canvas { outline: 2px solid var(--bad); outline-offset: 1px; }
.out-pad { height: 14px; }
.tip { position: absolute; pointer-events: none; z-index: 4; padding: 7px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font: 500 .72rem/1.5 var(--font-mono); opacity: 0; transition: opacity .12s; white-space: nowrap; box-shadow: var(--shadow); }
.tip.on { opacity: 1; }
.tip b { display: block; margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* viva talking points: numbered cards */
.viva-strip { margin-top: 18px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: end; }
.viva-strip h3 { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; margin-bottom: 14px; }
.viva-strip h3::before { content: ""; width: 18px; height: 2px; background: var(--accent); }
.viva-strip ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; counter-reset: pt; }
.viva-strip li { counter-increment: pt; position: relative; padding: 12px 14px 12px 44px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: .9rem; line-height: 1.5; color: var(--ink-2); }
.viva-strip li::before { content: counter(pt); position: absolute; left: 12px; top: 12px; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 600 .72rem var(--font-mono); background: var(--accent-soft); color: var(--accent); }
.exp-pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.exp-pager a { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 0; max-width: 340px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); text-decoration: none; box-shadow: var(--shadow-sm); transition: border-color .15s, transform .15s; }
.exp-pager a:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.exp-pager a.next { margin-left: auto; text-align: right; }
.exp-pager small { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.exp-pager b { font: 600 .98rem/1.3 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; line-height: 1.65; max-width: 100ch; }

/* ---------- quiz ---------- */
.quiz { max-width: 820px; margin-inline: auto; }
.q-hero { padding: 4px 0 2px; }

.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.topic { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: border-color .15s, background .15s; }

.topic .nm { min-width: 0; font-size: .87rem; line-height: 1.3; font-weight: 500; }
.topic .ct { margin-left: auto; font: 500 .72rem var(--font-mono); color: var(--muted); }
.topic[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
.topic[aria-pressed="true"] .no { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 14px; }

.best { color: var(--muted); font-size: .85rem; }

.start-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 20px; }

.play-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }

.meta { font: 500 .78rem var(--font-mono); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .73rem; font-weight: 500; color: var(--muted); }

.opts { display: grid; gap: 10px; }

<script>
/* =========================================================================
   engine-core.js — a tiny deep-learning engine in plain JavaScript.
   Layers: Dense, Dropout, Conv2D, MaxPool2D, Embedding, SimpleRNN, LSTM, GRU
   Optimisers: SGD, SGD+momentum, RMSprop, Adam.  Losses: cce, bce, mse.
   Everything is real forward/backward maths (gradient-checked in tests).
   ========================================================================= */
(function (G) {
  "use strict";

  /* ---------- helpers ---------- */
  const sum = (a) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; };
  const mean = (a) => sum(a) / a.length;
  const std1 = (a) => { const m = mean(a); let s = 0; for (const v of a) s += (v - m) * (v - m); return Math.sqrt(s / (a.length - 1)); };
  const quantile = (sorted, q) => { const p = (sorted.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return sorted[lo] + (sorted[hi] - sorted[lo]) * (p - lo); };
  const fx = (x, d = 4) => Number(x).toFixed(d);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ---------- seeded random numbers ---------- */
  function makeRng(seed) {
    let a = seed >>> 0, spare = null;
    const next = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const randn = () => {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = next();
      const v = next(), m = Math.sqrt(-2 * Math.log(u));
      spare = m * Math.sin(2 * Math.PI * v);
      return m * Math.cos(2 * Math.PI * v);
    };
    const r = {
      next, randn,
      int: (n) => Math.floor(next() * n),
      uniform: (lo, hi) => lo + (hi - lo) * next(),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
      perm(n) { const p = new Array(n); for (let i = 0; i < n; i++) p[i] = i; return r.shuffle(p); },
    };
    return r;
  }

  /* ---------- activations & initialisers ---------- */
  const ACT = {
    linear: { f: (z) => z, d: () => 1 },
    relu: { f: (z) => (z > 0 ? z : 0), d: (a) => (a > 0 ? 1 : 0) },
    tanh: { f: Math.tanh, d: (a) => 1 - a * a },
    sigmoid: { f: (z) => 1 / (1 + Math.exp(-z)), d: (a) => a * (1 - a) },
  };

  function initW(W, nin, nout, kind, rng, std) {
    const n = W.length;
    switch (kind) {
      case "zeros": break;
      case "normal": for (let i = 0; i < n; i++) W[i] = rng.randn() * (std == null ? 0.05 : std); break;      case "glorot_normal": { const s = Math.sqrt(2 / (nin + nout)); for (let i = 0; i < n; i++) W[i] = rng.randn() * s; break; }
      case "he_normal": { const s = Math.sqrt(2 / nin); for (let i = 0; i < n; i++) W[i] = rng.randn() * s; break; }
      case "he_uniform": { const l = Math.sqrt(6 / nin); for (let i = 0; i < n; i++) W[i] = rng.uniform(-l, l); break; }
      default: { const l = Math.sqrt(6 / (nin + nout)); for (let i = 0; i < n; i++) W[i] = rng.uniform(-l, l); }
    }
  }

  /* ---------- layers ---------- */
  class DenseL {
    constructor(nin, nout, o, rng) {
      o = o || {};
      this.kind = "dense"; this.nin = nin; this.nout = nout; this.act = o.act || "linear"; this.l2 = o.l2 || 0;
      this.W = new Float64Array(nin * nout); this.b = new Float64Array(nout);
      this.gW = new Float64Array(nin * nout); this.gb = new Float64Array(nout);
      initW(this.W, nin, nout, o.init || "glorot_uniform", rng, o.std);
      this.trainable = true;
    }
    paramCount() { return this.nin * this.nout + this.nout; }
    params() { return [{ w: this.W, g: this.gW }, { w: this.b, g: this.gb }]; }
    forward(x, n) {
      this.x = x; this.n = n;
      const { nin, nout, W, b } = this, out = new Float64Array(n * nout);
      for (let i = 0; i < n; i++) {
        const xo = i * nin, oo = i * nout;
        for (let j = 0; j < nout; j++) out[oo + j] = b[j];
        for (let k = 0; k < nin; k++) {
          const xv = x[xo + k]; if (xv === 0) continue;
          const wo = k * nout;
          for (let j = 0; j < nout; j++) out[oo + j] += xv * W[wo + j];
        }
      }
      if (this.act === "softmax") {
        for (let i = 0; i < n; i++) {
          const o = i * nout; let mx = -Infinity;
          for (let j = 0; j < nout; j++) if (out[o + j] > mx) mx = out[o + j];
          let s = 0;
          for (let j = 0; j < nout; j++) { const e = Math.exp(out[o + j] - mx); out[o + j] = e; s += e; }
          for (let j = 0; j < nout; j++) out[o + j] /= s;
        }
      } else if (this.act !== "linear") {
        const f = ACT[this.act].f;
        for (let i = 0; i < out.length; i++) out[i] = f(out[i]);
      }
      this.out = out; return out;
    }
    backward(dy, n, skipAct, needDx) {
      const { nin, nout, W, gW, gb, x } = this;
      let dz = dy;
      if (!skipAct && this.act !== "linear") {
        if (this.act === "softmax") throw new Error("softmax needs the combined cross-entropy gradient");
        dz = new Float64Array(dy.length);
        const d = ACT[this.act].d;
        for (let i = 0; i < dy.length; i++) dz[i] = dy[i] * d(this.out[i]);
      }
      gW.fill(0); gb.fill(0);
      for (let i = 0; i < n; i++) {
        const xo = i * nin, zo = i * nout;
        for (let j = 0; j < nout; j++) gb[j] += dz[zo + j];
        for (let k = 0; k < nin; k++) {
          const xv = x[xo + k]; if (xv === 0) continue;
          const go = k * nout;
          for (let j = 0; j < nout; j++) gW[go + j] += xv * dz[zo + j];
        }
      }
      if (this.l2) for (let i = 0; i < W.length; i++) gW[i] += 2 * this.l2 * W[i];
      if (!needDx) return null;
      const dx = new Float64Array(n * nin);
      for (let i = 0; i < n; i++) {
        const xo = i * nin, zo = i * nout;
        for (let k = 0; k < nin; k++) {
          let s = 0; const wo = k * nout;
          for (let j = 0; j < nout; j++) s += dz[zo + j] * W[wo + j];
          dx[xo + k] = s;
        }
      }
      return dx;
    }
    l2Loss() { if (!this.l2) return 0; let s = 0; for (let i = 0; i < this.W.length; i++) s += this.W[i] * this.W[i]; return this.l2 * s; }
  }

  class DropL {
    constructor(rate, rng) { this.kind = "dropout"; this.rate = rate; this.rng = rng; this.trainable = true; }
    paramCount() { return 0; }
    params() { return []; }
    forward(x, n, train) {
      if (!train || this.rate === 0) { this.mask = null; return x; }
      const out = new Float64Array(x.length), m = new Float64Array(x.length), keep = 1 - this.rate, sc = 1 / keep;
      for (let i = 0; i < x.length; i++) { if (this.rng.next() < keep) { m[i] = sc; out[i] = x[i] * sc; } }
      this.mask = m; return out;
    }
    backward(dy) {
      if (!this.mask) return dy;
      const dx = new Float64Array(dy.length);
      for (let i = 0; i < dy.length; i++) dx[i] = dy[i] * this.mask[i];
      return dx;
    }
  }

  class ConvL {
    constructor(h, w, cin, cout, k, o, rng) {
      o = o || {};
      this.kind = "conv"; this.h = h; this.w = w; this.cin = cin; this.cout = cout; this.k = k;
      this.oh = h - k + 1; this.ow = w - k + 1; this.relu = o.act === "relu";
      this.W = new Float64Array(cout * cin * k * k); this.b = new Float64Array(cout);
      this.gW = new Float64Array(this.W.length); this.gb = new Float64Array(cout);
      const lim = Math.sqrt(6 / ((cin + cout) * k * k));
      for (let i = 0; i < this.W.length; i++) this.W[i] = rng.uniform(-lim, lim);
      this.trainable = true;
    }
    paramCount() { return this.cout * this.cin * this.k * this.k + this.cout; }
    params() { return [{ w: this.W, g: this.gW }, { w: this.b, g: this.gb }]; }
    forward(x, n) {
      this.x = x; this.n = n;
      const { h, w, cin, cout, k, oh, ow, W, b } = this, out = new Float64Array(n * cout * oh * ow);
      for (let s = 0; s < n; s++) for (let co = 0; co < cout; co++) {
        for (let oy = 0; oy < oh; oy++) for (let ox = 0; ox < ow; ox++) {
          let sm = b[co];
          for (let ci = 0; ci < cin; ci++) for (let ky = 0; ky < k; ky++) {
            const xi = ((s * cin + ci) * h + oy + ky) * w + ox, wi = ((co * cin + ci) * k + ky) * k;
            for (let kx = 0; kx < k; kx++) sm += x[xi + kx] * W[wi + kx];
          }
          out[((s * cout + co) * oh + oy) * ow + ox] = this.relu ? (sm > 0 ? sm : 0) : sm;
        }
      }
      this.out = out; return out;
    }
    backward(dy, n, _s, needDx) {
      const { h, w, cin, cout, k, oh, ow, W, gW, gb, x, out } = this;
      gW.fill(0); gb.fill(0);
      const dx = needDx ? new Float64Array(n * cin * h * w) : null;
